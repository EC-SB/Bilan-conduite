<!-- ============================================================
     RENDEZ-VOUS PÉDAGOGIQUE — VOS DISPONIBILITÉS
     Évolution Conduites

     Un élève et son accompagnateur arrivent ici depuis leur mail.
     Ils reçoivent LE MÊME LIEN et remplissent LA MÊME grille : ils
     viennent ensemble, ils répondent ensemble.

     ⚠️ CETTE PAGE LIT D'ABORD, ET N'ÉCRIT QUE SUR CLIC.

     Les messageries ouvrent les liens toutes seules pour les
     contrôler — Outlook et Gmail le font systématiquement. Une page
     qui enregistrerait une disponibilité à l'ouverture enregistrerait
     donc des réponses que personne n'a données, et le bureau
     choisirait sa date là-dessus. C'est déjà la règle du lien de
     cours, pour la même raison.

     Le jeton ne vaut que pour cette proposition. Il ne connecte à
     rien, ne montre aucun autre élève, et meurt à la date limite.
     ============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">

<style>
  :root{
    --fond:#0B0B0B; --carte:#121212; --ligne:#2A2A2A; --creme:#F2EFE9;
    --gris:#9A968E; --orange:#E8A33D; --vert:#B6FF0E; --bleu:#5EC8FF;
  }
  @media (prefers-color-scheme: light){

  .page{max-width:460px;width:100%;padding:28px 18px 40px}
  .marque{font-size:11px;letter-spacing:.18em;text-transform:uppercase;
          color:var(--gris);margin-bottom:22px;text-align:center}

  label{display:block;font-size:13px;color:var(--gris);margin:18px 0 6px}

  /* 🗓️ v1595 — « Nous sommes plutôt disponibles » */
  .dispos{border-color:var(--orange);margin-top:12px}

  .dispos .jour{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--ligne)}

  .dispos label{margin:14px 0 6px}

<body>
<div class="page">
  <div class="marque">Évolution Conduites</div>
  <div id="zone"><p class="gris centre">Un instant…</p></div>
</div>

<script>
var PROXY = 'https://bilan-proxy.evolutionconduites.workers.dev';

var jeton = (location.search.match(/[?&]r=([A-Za-z0-9]{22})/) || [])[1] || '';
var zone = document.getElementById('zone');
var etat = { reponses: {}, accompagnateur: '', repond: '',
             /* 🗓️ v1595 — ses jours (« lun-ma », « sam-ap »…), la période, une précision */
             dispos: { jours: [], du: '', au: '', precision: '' } };
var JOURS_DISPOS = [['lun', 'Lundi'], ['mar', 'Mardi'], ['mer', 'Mercredi'], ['jeu', 'Jeudi'], ['ven', 'Vendredi'], ['sam', 'Samedi']];
var donnees = null;

function ech(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ⚠️ CETTE FONCTION NE VOIT PAS QUE DE L'ISO.

   La date limite part « 2026-09-15 » dans le classeur, mais Google
   la reconvertit en objet Date : selon le chemin de lecture elle
   revient « 2026-09-15 », « 15/09/2026 », ou
   « Mon Sep 15 2026 00:00:00 GMT+0200 ». La première version ne
   reconnaissait que la première forme et RECOPIAIT les autres telles
   quelles — les familles lisaient donc leur date limite en anglais
   et en GMT. La source est corrigée des deux côtés ; ici on accepte
   quand même les trois, pour qu'un tour déjà ouvert reste lisible. */
function jourFr(v){
  var t = String(v == null ? '' : v).trim();
  if(!t) return '';

  var a = '', mo = '', j = '';
  var m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){ a = m[1]; mo = m[2]; j = m[3]; }
  if(!a){
    m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m){ j = ('0' + m[1]).slice(-2); mo = ('0' + m[2]).slice(-2); a = m[3]; }
  }
  if(!a){
    /* Dernier recours : la forme anglaise que rend String(Date),
       « Mon Sep 15 2026 00:00:00 GMT+0200 ».

       ⚠️ ON LA LIT AU MOT, ON NE LA PASSE PAS DANS new Date().
       new Date() la ramènerait au fuseau du visiteur : la même
       chaîne rendrait le 15 à Paris et le 14 à Londres, sur une
       date limite. Ici les chiffres écrits sont les bons. */
    var MOIS_EN = { jan:'01', feb:'02', mar:'03', apr:'04', may:'05',
                    jun:'06', jul:'07', aug:'08', sep:'09', oct:'10',
                    nov:'11', dec:'12' };
    m = t.match(/\b([A-Za-z]{3})[a-z]*\s+(\d{1,2})\s+(\d{4})\b/);
    if(m && MOIS_EN[m[1].toLowerCase()]){
      mo = MOIS_EN[m[1].toLowerCase()];
      j = ('0' + m[2]).slice(-2);
      a = m[3];
    }
  }
  if(!a) return t;

  var d = new Date(a + '-' + mo + '-' + j + 'T12:00:00');
  if(isNaN(d.getTime())) return j + '/' + mo + '/' + a;
  try{
    return d.toLocaleDateString('fr-FR',
      { weekday:'long', day:'numeric', month:'long' });
  }catch(e){ return j + '/' + mo + '/' + a; }
}

function rien(msg){
  zone.innerHTML = '<div class="pastille centre">🔗</div>' +
    '<h1 class="centre">Ce lien ne fonctionne plus</h1>' +
    '<p class="gris centre">' + ech(msg || '') + '</p>' +
    '<p class="pied">Appelez-nous, nous vous donnerons les dates ' +
    'par téléphone.</p>';
}

/* ============================================================
   🗓️ « NOUS SOMMES PLUTÔT DISPONIBLES » — v1595

   David, le 27/11 : quand aucune date proposée ne convient, la famille
   dit ses jours de la semaine (le matin et/ou l'après-midi), une période
   et une précision. Le bloc s'ouvre quand elle touche « Aucune de ces
   dates », quand elle n'a pas répondu au bout de 7 jours, et quand on
   l'a relancée (« ouvrirDispos », dit par le serveur) ; et toujours s'il
   y a déjà des dispos (données par elle, ou notées par le bureau).
   ============================================================ */
function tousNonDispos(){
  return !!((donnees.creneaux || []).length &&
    (donnees.creneaux || []).every(function(c){ return etat.reponses[c.id] === 'non'; }));
}
function disposRemplies(x){
  return !!(x && ((x.jours || []).length || x.du || x.au || x.precision));
}
function disposOuvertes(){
  return tousNonDispos() || !!donnees.ouvrirDispos || disposRemplies(donnees.dispos) || disposRemplies(etat.dispos);
}
/* Ce qui est tapé dans les champs, gardé avant de redessiner */
function lireChampsDispos(){
  var du = document.getElementById('dispoDu'), au = document.getElementById('dispoAu'), pr = document.getElementById('dispoPrecision');
  if(du) etat.dispos.du = du.value;
  if(au) etat.dispos.au = au.value;
  if(pr) etat.dispos.precision = pr.value;
}
function dateCourteDispos(iso){
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}
/* « Mardi après-midi · Samedi matin », pour le relire */
function phraseDispos(x){
  var j = (x && x.jours) || [];
  var out = [];
  JOURS_DISPOS.forEach(function(d){
    var ma = j.indexOf(d[0] + '-ma') !== -1, ap = j.indexOf(d[0] + '-ap') !== -1;
    if(ma && ap) out.push(d[1] + ' toute la journée');
    else if(ma) out.push(d[1] + ' matin');
    else if(ap) out.push(d[1] + ' après-midi');
  });
  return out.join(' · ');
}
function periodeDispos(x){
  if(!x) return '';
  if(x.du && x.au) return 'du ' + dateCourteDispos(x.du) + ' au ' + dateCourteDispos(x.au);
  if(x.du) return 'à partir du ' + dateCourteDispos(x.du);
  if(x.au) return 'jusqu\'au ' + dateCourteDispos(x.au);
  return '';
}
function blocDispos(clos){
  var x = etat.dispos;
  if(clos){
    if(!disposRemplies(x)) return '';
    return '<div class="creneau dispos"><div class="quand">🗓️ Vous êtes plutôt disponibles</div>' +
      '<div class="lecture">' + ech(phraseDispos(x) || '—') + '</div>' +
      (periodeDispos(x) ? '<div class="ou">' + ech(periodeDispos(x)) + '</div>' : '') +
      (x.precision ? '<div class="ou">« ' + ech(x.precision) + ' »</div>' : '') + '</div>';
  }
  var h = '<div class="creneau dispos" id="blocDispos"><div class="quand">🗓️ Nous sommes plutôt disponibles…</div>' +
    '<div class="ou">Touchez les jours qui vous arrangent, le matin et/ou l’après-midi. Nous nous en servirons pour vous proposer d’autres dates.' +
    (donnees.dispos && donnees.dispos.source === 'bureau' ? ' Nous avons noté ce que vous nous avez dit au téléphone : corrigez si besoin.' : '') + '</div>';
  JOURS_DISPOS.forEach(function(d){
    var ma = x.jours.indexOf(d[0] + '-ma') !== -1, ap = x.jours.indexOf(d[0] + '-ap') !== -1;
    h += '<div class="jour"><span>' + d[1] + '</span><div class="choix">' +
      '<button type="button" data-dispo="' + d[0] + '-ma" aria-pressed="' + ma + '" class="' + (ma ? 'on' : '') + '">🌅 Matin</button>' +
      '<button type="button" data-dispo="' + d[0] + '-ap" aria-pressed="' + ap + '" class="' + (ap ? 'on' : '') + '">🌇 Après-midi</button>' +
      '</div></div>';
  });
  h += '<label for="dispoDu">Sur quelle période ? (facultatif)</label>' +
    '<div class="periode"><span>du</span><input type="date" id="dispoDu" value="' + ech(x.du) + '" aria-label="Du">' +
    '<span>au</span><input type="date" id="dispoAu" value="' + ech(x.au) + '" aria-label="Au"></div>' +
    '<label for="dispoPrecision">Une précision ? (facultatif)</label>' +
    '<input type="text" id="dispoPrecision" maxlength="200" placeholder="Par exemple : pas le 24 ni le 26" value="' + ech(x.precision) + '">' +
    '</div>';
  return h;
}

/* ============================================================
   L'ÉCRAN

   Une carte par créneau, deux boutons : on peut / on ne peut pas.
   PAS de case à cocher : « décoché » et « pas encore répondu » se
   ressemblent trop, et c'est précisément la distinction dont le
   bureau a besoin.
   ============================================================ */
function dessiner(){
  var d = donnees;
  var clos = !!d.clos;

  var h = '<div class="pastille centre">🗣️</div>' +
    '<h1>Bonjour ' + ech(d.prenom) + '</h1>' +
    /* « théorique » se dit ici comme dans le mail : la famille
       reçoit aussi des convocations pour les rendez-vous
       pédagogiques PRATIQUES, qui ne réunissent qu'elle. */
    '<p>Nous organisons le <strong>rendez-vous pédagogique théorique</strong> de ' +
    ech(d.eleve) + '. L\'élève vient <strong>avec son accompagnateur</strong>.</p>' +
    /* ⚠️ LA RÈGLE DU JEU SE DIT AVANT LES CASES.

       Sans elle, la famille coche la date qui l'arrange et s'arrête
       là : le bureau récolte huit réponses qui ne se croisent nulle
       part. Ce rendez-vous réunit plusieurs familles, il faut donc
       TOUTES leurs disponibilités. */
    '<div class="avis">Vous serez <strong>plusieurs familles</strong> à ce ' +
    'rendez-vous. Merci de sélectionner <strong>toutes les dates</strong> ' +
    'auxquelles vous êtes disponibles : celle qui aura obtenu la ' +
    '<strong>majorité</strong> des réponses sera retenue, et nous vous la ' +
    'confirmerons ultérieurement.</div>';

  if(clos){
    /* ⚠️ CLOS N'EST PAS UNE RÉPONSE.

       David : « votre rendez-vous est le … pour les retenus, et un
       "nous vous reproposerons" pour les autres ».

       La page disait la même chose à tout le monde — « les réponses
       sont closes, voici ce que vous nous aviez indiqué » — c'est-à-
       dire rien de ce que la famille était venue chercher. Elle a
       coché ses disponibilités, elle veut savoir si elle vient, et
       quand. Deux situations, donc deux phrases, et chacune n'en dit
       qu'une.

       Le troisième cas existe et reste le message d'avant : un tour
       fermé par la date limite, sans qu'aucun créneau ait été
       retenu. Là, il n'y a effectivement rien à annoncer. */
    var creneauRetenu = null;
    (d.creneaux || []).forEach(function(c){
      if(d.retenu && String(c.id) === String(d.retenu)) creneauRetenu = c;
    });

    if(creneauRetenu && d.retenuPourVous){
      h += '<div class="avis">✅ <strong>Votre rendez-vous est le ' +
        ech(jourFr(creneauRetenu.date)) +
        (creneauRetenu.heure ? ' à ' + ech(creneauRetenu.heure) : '') +
        '.</strong>' +
        (creneauRetenu.lieu ? '<br>📍 ' + ech(creneauRetenu.lieu) : '') +
        "<br>L'élève vient <strong>avec son accompagnateur</strong>.</div>";
    }else if(creneauRetenu){
      h += '<div class="avis chaud">' +
        '⏳ Aucune date ne réunissait tout le monde : ' +
        '<strong>nous vous en reproposerons</strong> prochainement.' +
        '<br>Voici ce que vous nous aviez indiqué.</div>';
    }else{
      h += '<div class="avis chaud">Les réponses sont closes' +
        (d.limite ? ' depuis le ' + ech(jourFr(d.limite)) : '') + '.<br>' +
        'Voici ce que vous nous aviez indiqué.</div>';
    }
  }else{
    h += '<p class="gris">Dites-nous ce qui vous convient. Vous pourrez ' +
      'modifier' + (d.limite ? " jusqu'au <strong>" + ech(jourFr(d.limite)) +
      '</strong>' : '') + '.</p>';
  }

  (d.creneaux || []).forEach(function(c){
    var r = etat.reponses[c.id] || '';
    h += '<div class="creneau">' +
      '<div class="quand">' + ech(jourFr(c.date)) +
        (c.heure ? ' à ' + ech(c.heure) : '') + '</div>' +
      (c.lieu ? '<div class="ou">' + ech(c.lieu) + '</div>' : '') +
      '<div class="choix">' +
        '<button type="button" data-c="' + ech(c.id) + '" data-v="oui"' +
          (clos ? ' disabled' : '') +
          ' class="' + (r === 'oui' ? 'on' : '') + '">✅ On peut</button>' +
        '<button type="button" data-c="' + ech(c.id) + '" data-v="non"' +
          (clos ? ' disabled' : '') +
          ' class="non ' + (r === 'non' ? 'on' : '') + '">✖️ On ne peut pas</button>' +
      '</div></div>';
  });

  if(!clos){
    /* ⚠️ « AUCUNE DE CES DATES » DOIT ÊTRE UN GESTE, PAS SIX.

       Sans ce bouton, la famille qui ne peut à aucune date devait
       appuyer « on ne peut pas » sur chaque créneau. Beaucoup
       s'arrêtaient en route ou ne répondaient pas du tout — et le
       bureau lisait un silence là où il y avait un non clair, donc
       relançait quelqu'un qui avait déjà répondu.

       Il coche tous les créneaux en « on ne peut pas » et laisse
       la main : rien ne part avant le bouton d'envoi. */
    var tousNon = (d.creneaux || []).length &&
      (d.creneaux || []).every(function(c){
        return etat.reponses[c.id] === 'non';
      });
    h += '<button type="button" id="aucune" class="' +
      (tousNon ? 'non on' : '') + '" ' +
      'style="background:transparent;border:1.5px solid var(--ligne);' +
      'color:var(--creme);font-size:15px;padding:12px;' +
      (tousNon ? 'background:var(--orange);color:#0B0B0B;' +
                 'border-color:var(--orange);' : '') + '">' +
      '✖️ Aucune de ces dates ne nous convient</button>' +
      (disposOuvertes() ? blocDispos(false) : '') +
      '<label for="qui">Qui remplit cette réponse&nbsp;?</label>' +
      '<div class="choix">' +
        '<button type="button" data-qui="eleve" class="' +
          (etat.repond === 'eleve' ? 'on' : '') + '">L\'élève</button>' +
        '<button type="button" data-qui="accompagnateur" class="' +
          (etat.repond === 'accompagnateur' ? 'on' : '') +
          '">L\'accompagnateur</button>' +
      '</div>' +
      '<label for="acc">Nom de l\'accompagnateur qui viendra</label>' +
      '<input type="text" id="acc" autocomplete="name" ' +
        'placeholder="Prénom et nom" value="' + ech(etat.accompagnateur) + '">' +
      '<button id="envoyer" type="button">Envoyer nos disponibilités</button>' +
      '<div id="msg" class="gris centre" style="margin-top:10px"></div>';
  }

  /* 🗓️ v1595 — une proposition close : ce qu'ils avaient indiqué */
  if(clos) h += blocDispos(true);

  if(d.reponduLe){
    h += '<p class="pied">Dernière réponse enregistrée le ' +
      ech(d.reponduLe) +
      (d.accompagnateur ? '<br>Accompagnateur indiqué&nbsp;: ' +
        ech(d.accompagnateur) : '') + '</p>';
  }

  h += '<p class="pied">Ce lien vous est personnel. L\'élève et ' +
    'l\'accompagnateur remplissent la même réponse.</p>';

  zone.innerHTML = h;
  brancher();
}

function brancher(){
  zone.querySelectorAll('button[data-c]').forEach(function(b){
    b.addEventListener('click', function(){
      lireChampsDispos();
      var champ = document.getElementById('acc');
      if(champ) etat.accompagnateur = champ.value;
      etat.reponses[b.getAttribute('data-c')] = b.getAttribute('data-v');
      dessiner();
    });
  });
  /* 🗓️ v1595 — un jour, matin ou après-midi : un appui pose, un second retire */
  zone.querySelectorAll('button[data-dispo]').forEach(function(b){
    b.addEventListener('click', function(){
      lireChampsDispos();
      var champ = document.getElementById('acc');
      if(champ) etat.accompagnateur = champ.value;
      var k = b.getAttribute('data-dispo');
      var i = etat.dispos.jours.indexOf(k);
      if(i === -1) etat.dispos.jours.push(k); else etat.dispos.jours.splice(i, 1);
      var y = window.scrollY;
      dessiner();
      window.scrollTo(0, y);
    });
  });
  zone.querySelectorAll('button[data-qui]').forEach(function(b){
    b.addEventListener('click', function(){
      lireChampsDispos();
      var champ = document.getElementById('acc');
      if(champ) etat.accompagnateur = champ.value;
      etat.repond = b.getAttribute('data-qui');
      dessiner();
    });
  });
  var auc = document.getElementById('aucune');
  if(auc) auc.addEventListener('click', function(){
    lireChampsDispos();
    var champ = document.getElementById('acc');
    if(champ) etat.accompagnateur = champ.value;
    /* Un second appui défait : c'est un bouton, pas un piège. */
    var tousNon = (donnees.creneaux || []).length &&
      (donnees.creneaux || []).every(function(c){
        return etat.reponses[c.id] === 'non';
      });
    etat.reponses = {};
    if(!tousNon){
      (donnees.creneaux || []).forEach(function(c){
        etat.reponses[c.id] = 'non';
      });
    }
    dessiner();
  });

  var env = document.getElementById('envoyer');
  if(env) env.addEventListener('click', envoyer);
}

/* ============================================================
   L'ENVOI — en POST, et seulement sur ce clic
   ============================================================ */
function envoyer(){
  var champ = document.getElementById('acc');
  if(champ) etat.accompagnateur = champ.value.trim();
  lireChampsDispos();
  /* 🗓️ v1595 — les dispos ne partent que si le bloc est à l'écran : sinon
     on ne touche pas à celles que le bureau aurait notées */
  var avecDispos = !!document.getElementById('blocDispos');

  var msg = document.getElementById('msg');
  var b = document.getElementById('envoyer');

  /* UNE RÉPONSE VIDE NE PART PAS. « Je n'ai rien coché » et « je ne
     peux à aucune date » sont deux choses différentes, et le bureau
     doit pouvoir les distinguer. */
  var repondus = Object.keys(etat.reponses).length;
  if(!repondus){
    msg.textContent = (avecDispos && disposRemplies(etat.dispos)) ?
      'Dites-nous aussi, pour les dates proposées, si vous pouvez : ' +
      'ou touchez « Aucune de ces dates ».' :
      'Indiquez au moins un créneau, même pour dire ' +
      'que vous ne pouvez pas.';
    return;
  }

  b.disabled = true;
  msg.textContent = 'Envoi…';

  fetch(PROXY + '/rvt', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: JSON.stringify({ r: jeton, reponses: etat.reponses,
                           accompagnateur: etat.accompagnateur,
                           repond: etat.repond,
                           dispos: avecDispos ? etat.dispos : undefined })
  }).then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.status !== 'ok'){
        b.disabled = false;
        msg.textContent = (d && (d.message || d.error)) ||
                          "L'envoi n'a pas abouti. Réessayez.";
        return;
      }
      if(avecDispos) donnees.dispos = d.dispos || null;
      merci(d.reponduLe);
    })
    .catch(function(){
      b.disabled = false;
      msg.textContent = "L'envoi n'a pas abouti. Réessayez.";
    });
}

function merci(quand){
  var ouis = (donnees.creneaux || []).filter(function(c){
    return etat.reponses[c.id] === 'oui';
  });

  var h = '<div class="pastille centre">✅</div>' +
    '<h1 class="centre">C\'est noté, merci</h1>';

  /* ON REDIT CE QU'ILS VIENNENT DE DIRE. Un « merci » seul laisse
     douter de ce qui est parti. */
  if(ouis.length){
    h += '<p class="gris">Vous nous avez indiqué&nbsp;:</p>';
    ouis.forEach(function(c){
      h += '<div class="creneau"><div class="quand">✅ ' +
        ech(jourFr(c.date)) + (c.heure ? ' à ' + ech(c.heure) : '') +
        '</div></div>';
    });
  }else{
    h += '<div class="avis chaud">Vous nous avez indiqué que ' +
      '<strong>aucun de ces créneaux</strong> ne vous convient. ' +
      'Nous vous proposerons d\'autres dates.</div>';
  }
  /* 🗓️ v1595 — et leurs dispos, redites */
  if(disposRemplies(etat.dispos) && document.getElementById('blocDispos')){
    h += '<p class="gris">Vous êtes plutôt disponibles&nbsp;:</p>' +
      '<div class="creneau"><div class="quand">🗓️ ' + ech(phraseDispos(etat.dispos) || '—') + '</div>' +
      (periodeDispos(etat.dispos) ? '<div class="ou">' + ech(periodeDispos(etat.dispos)) + '</div>' : '') +
      (etat.dispos.precision ? '<div class="ou">« ' + ech(etat.dispos.precision) + ' »</div>' : '') + '</div>';
  }

  /* ⚠️ ON LE REDIT ICI, AU MOMENT DE LA CONFIRMATION.

     C'est le seul écran que la famille relit : « c'est noté » seul
     laisse croire que la date cochée est acquise, et elle note sa
     date sur le frigo. Elle doit repartir en sachant qu'ils seront
     plusieurs, que c'est la majorité qui décide, et que la vraie
     date arrivera plus tard. */
  h += '<div class="avis" style="margin-top:16px">Vous serez ' +
    '<strong>plusieurs familles</strong> à ce rendez-vous. La date ayant ' +
    'obtenu la <strong>majorité</strong> des réponses sera retenue, et ' +
    'nous vous la <strong>confirmerons ultérieurement</strong>.</div>';

  if(donnees.limite){
    h += '<div class="avis">Vous pouvez revenir sur ce lien et modifier ' +
      "votre réponse jusqu'au <strong>" + ech(jourFr(donnees.limite)) +
      '</strong>.</div>' +
      '<button type="button" id="revenir">Modifier ma réponse</button>';
  }

  h += '<p class="pied">Enregistré le ' + ech(quand || '') + '</p>';
  zone.innerHTML = h;

  var rev = document.getElementById('revenir');
  if(rev) rev.addEventListener('click', function(){ dessiner(); });
}

/* ============================================================
   AU CHARGEMENT : ON LIT, ET RIEN D'AUTRE
   ============================================================ */
if(!jeton){
  rien('Ce lien est incomplet.');
}else{
  fetch(PROXY + '/rvt?r=' + encodeURIComponent(jeton))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.status !== 'ok'){
        return rien((d && (d.message || d.error)) || 'Ce lien a expiré.');
      }
      donnees = d;
      etat.reponses = d.reponses || {};
      etat.accompagnateur = d.accompagnateur || '';
      etat.repond = d.repond || '';
      /* 🗓️ v1595 — leurs dispos (ou celles notées par le bureau), déjà remplies */
      if(d.dispos) etat.dispos = { jours: (d.dispos.jours || []).slice(), du: d.dispos.du || '', au: d.dispos.au || '', precision: d.dispos.precision || '' };
      dessiner();
    })
    .catch(function(){
      rien("Nous n'arrivons pas à joindre nos données pour le moment.");
    });
}
</script>
