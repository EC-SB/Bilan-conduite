<!DOCTYPE html>
<!-- Déployé le 02/09/2026 à 12:35 — v804 -->
<!-- ============================================================
     CONFIRMATION DE PRÉSENCE — Évolution Conduites

     Un élève arrive ici en appuyant sur le bouton « Je serai
     présent » de son mail de rappel. Un mail ne peut rien
     exécuter : ce qu'on y appelle un bouton est toujours un lien,
     et il faut bien qu'il ouvre quelque chose. Cette page est ce
     quelque chose, réduit au strict nécessaire — elle confirme
     toute seule et dit merci.

     La confirmation part en POST, depuis le script. Les
     anti-virus et les aperçus de messagerie ouvrent les liens
     tout seuls, mais n'exécutent pas de script : ils ne peuvent
     donc pas confirmer une présence à la place de l'élève.

     Le jeton ne vaut que pour ce cours. Il ne connecte à rien.
     ============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>C'est noté — Évolution Conduites</title>
<style>
  :root{
    --fond:#0B0B0B; --carte:#121212; --ligne:#2A2A2A; --creme:#F2EFE9;
    --gris:#9A968E; --orange:#E8A33D; --vert:#B6FF0E; --bleu:#5EC8FF;
  }
  @media (prefers-color-scheme: light){
    :root{ --fond:#F4F2ED; --carte:#FFFFFF; --ligne:#E4E0D8; --creme:#1A1A1A;
           --gris:#8A857C; --orange:#B87A12; --vert:#B6FF0E; --bleu:#0B6FA4; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; background:var(--fond); color:var(--creme);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .page{max-width:420px;width:100%;padding:28px 18px 40px;text-align:center}
  .marque{font-size:11px;letter-spacing:.18em;text-transform:uppercase;
          color:var(--gris);margin-bottom:26px}
  .pastille{font-size:52px;line-height:1;margin-bottom:14px}
  h1{font-size:24px;margin:0 0 8px;line-height:1.3}
  p{margin:0 0 14px;font-size:16px}
  .gris{color:var(--gris);font-size:14px}
  .rappel{background:var(--carte);border:1px solid var(--ligne);
          border-radius:13px;padding:14px 16px;margin:22px 0 0;
          font-size:15px;text-align:left}
  .rappel .quand{font-weight:800;color:var(--orange);font-size:17px}
  .diag{margin-top:18px;font-size:11px;color:var(--gris);word-break:break-word;
        text-align:left;background:var(--carte);border:1px solid var(--ligne);
        border-radius:9px;padding:9px 11px}
  .rappel .ou{color:var(--gris);font-size:14px;margin-top:3px}
  button{
    width:100%;padding:15px;font-size:17px;font-weight:700;cursor:pointer;
    border-radius:12px;border:0;background:var(--vert);color:#0B0B0B;
    font-family:inherit;margin-top:18px;
  }
  button:disabled{opacity:.6;cursor:default}
  .pied{color:var(--gris);font-size:12px;margin-top:28px;line-height:1.7}
</style>
</head>
<body>
<div class="page">
  <div class="marque">Évolution Conduites</div>
  <div id="zone"><p class="gris">Un instant…</p></div>
</div>

<script>
var PROXY = 'https://bilan-proxy.evolutionconduites.workers.dev';
var jeton = (new URLSearchParams(location.search).get('c') || '').trim();
var zone = document.getElementById('zone');

function txt(s){
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

/* Le cours en une ligne : confirmer sans savoir quoi n'aurait
   aucun sens, mais ce n'est pas une fiche pour autant. */
function rappelDuCours(c){
  if(!c || !c.date) return '';
  return '<div class="rappel"><div class="quand">' + txt(c.date) +
    (c.heure ? ' à ' + txt(c.heure) : '') + '</div>' +
    (c.lieu ? '<div class="ou">' + txt(c.lieu) + '</div>' : '') +
    '</div>';
}

function merci(c, quand){
  zone.innerHTML =
    '<div class="pastille">✅</div>' +
    '<h1>C\'est noté' + (c && c.prenom ? ', ' + txt(c.prenom) : '') + ' !</h1>' +
    '<p class="gris">Nous savons que tu seras là. À très vite.</p>' +
    rappelDuCours(c) +
    '<div class="pied">' +
      (quand ? 'Confirmé le ' + txt(quand) + '<br>' : '') +
      'Si finalement tu ne peux pas venir, préviens-nous au moins ' +
      '48 heures à l\'avance : passé ce délai, la leçon est facturée.' +
    '</div>';
}

/* Le script n'a pas pu confirmer : plutôt que de laisser l'élève
   croire que c'est fait, on lui donne le bouton. */
function aConfirmer(c){
  zone.innerHTML =
    '<h1>Bonjour' + (c && c.prenom ? ' ' + txt(c.prenom) : '') + ' 👋</h1>' +
    '<p class="gris">Confirme ta présence à ce cours.</p>' +
    rappelDuCours(c) +
    '<button id="ok">✋ Je serai présent</button>';

  document.getElementById('ok').addEventListener('click', function(){
    this.disabled = true;
    this.textContent = 'Un instant…';
    confirmer(c, true);
  });
}

function rien(message, diag){
  zone.innerHTML = '<div class="pastille">🤔</div>' +
    '<h1>' + txt(message) + '</h1>' +
    '<p class="gris">Appelle-nous, nous te redirons tout.</p>' +
    /* Le détail technique, discret : sans lui, personne au bureau
       ne peut dire ce qui a coincé. */
    (diag ? '<div class="diag">' + txt(JSON.stringify(diag)) + '</div>' : '');
}

function confirmer(c, manuel){
  envoyerConfirmation()
  .then(function(d){
    if(d && d.confirmeLe) merci(c, d.confirmeLe);
    else throw new Error('échec');
  })
  .catch(function(){
    if(manuel){
      zone.innerHTML += '<p class="gris">La confirmation n\'est pas passée. ' +
        'Réessaie dans un instant, ou préviens-nous directement.</p>';
    }else{
      aConfirmer(c);
    }
  });
}

/* ============================================================
   LES DEUX DEMANDES PARTENT ENSEMBLE

   L'élève attendait deux allers-retours l'un derrière l'autre :
   d'abord lire son cours, ENSUITE confirmer. Chacun passe par le
   classeur, qui met plusieurs secondes — et lui n'a qu'un bouton
   à appuyer, sur son téléphone, souvent en 4G.

   Les deux ne dépendent pourtant pas l'une de l'autre : la
   confirmation n'a besoin que du jeton, qui est dans le lien.
   Elles partent donc en même temps, et l'attente n'est plus que
   celle de la plus lente des deux au lieu de leur somme.

   La lecture ne sert qu'à écrire son prénom et l'heure de son
   cours : si elle traîne, le « c'est noté » s'affiche sans, et se
   complète quand elle arrive. Ce qu'il est venu faire est fait.
   ============================================================ */
function envoyerConfirmation(){
  return fetch(PROXY + '/cours', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ c: jeton, confirmer: true })
  }).then(function(r){ return r.json(); });
}

if(!jeton){
  rien('Ce lien est incomplet.');
}else{
  var laLecture = fetch(PROXY + '/cours?c=' + encodeURIComponent(jeton))
    .then(function(r){ return r.json(); });
  var laConfirmation = envoyerConfirmation();

  /* Ce qui est déjà affiché, pour ne pas l'écrire deux fois */
  var affiche = '';

  laConfirmation.then(function(d){
    if(!d || !d.confirmeLe) return;          /* la lecture dira pourquoi */
    affiche = 'merci';
    merci(null, d.confirmeLe);
    /* Le prénom et l'horaire complètent l'écran dès qu'ils sont là. */
    laLecture.then(function(l){
      if(l && l.cours) merci(l.cours, d.confirmeLe);
    }).catch(function(){ /* l'essentiel est dit */ });
  }).catch(function(){ /* la lecture décidera de la suite */ });

  laLecture.then(function(d){
    if(affiche) return;                      /* déjà remercié */
    if(!d || !d.cours) return rien((d && (d.message || d.error)) ||
                                   'Ce lien a expiré.', d && d.diag);
    /* Déjà confirmé un autre jour : on ne le redemande pas. */
    if(d.cours.confirmeLe){ affiche = 'merci'; return merci(d.cours, d.cours.confirmeLe); }

    /* La confirmation est partie : on attend sa réponse plutôt que
       d'en lancer une seconde. */
    laConfirmation.then(function(r){
      if(affiche) return;
      if(r && r.confirmeLe){ affiche = 'merci'; merci(d.cours, r.confirmeLe); }
      else aConfirmer(d.cours);
    }).catch(function(){ if(!affiche) aConfirmer(d.cours); });
  }).catch(function(){
    /* Sans la lecture, la confirmation peut tout de même avoir
       abouti : on ne dit « impossible » qu'après l'avoir attendue. */
    laConfirmation.then(function(r){
      if(affiche) return;
      if(r && r.confirmeLe){ affiche = 'merci'; merci(null, r.confirmeLe); }
      else rien('Impossible de te répondre pour le moment.');
    }).catch(function(){
      if(!affiche) rien('Impossible de te répondre pour le moment.');
    });
  });
}
</script>
</body>
</html>
