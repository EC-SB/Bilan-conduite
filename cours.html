<!DOCTYPE html>
<!-- ============================================================
     LE COURS D'UN ÉLÈVE — Évolution Conduites

     Cette page s'ouvre depuis le lien d'un mail de rappel, sans
     compte ni code. Le jeton de l'adresse fait l'autorisation et
     ne vaut que pour un cours : il ne connecte à rien d'autre, et
     surtout pas au coin révisions, dont le code est permanent.

     Elle ne porte que le prénom. Une page sans mot de passe n'a
     pas à désigner quelqu'un par son nom complet.
     ============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ton cours — Évolution Conduites</title>
<style>
  :root{
    --fond:#0B0B0B; --carte:#121212; --ligne:#2A2A2A; --creme:#F2EFE9;
    --gris:#9A968E; --orange:#E8A33D; --vert:#B6FF0E; --rouge:#FF6B5E;
    --bleu:#5EC8FF;
  }
  @media (prefers-color-scheme: light){
    :root{ --fond:#F7F5F1; --carte:#FFFFFF; --ligne:#E2DED6; --creme:#16150F;
           --gris:#6B675F; --orange:#B87A12; --vert:#4E7A00; --rouge:#C0342A;
           --bleu:#0B6FA4; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px 16px 40px; background:var(--fond); color:var(--creme);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .page{max-width:520px;margin:0 auto}
  .marque{font-size:12px;letter-spacing:.16em;text-transform:uppercase;
          color:var(--gris);text-align:center;margin-bottom:18px}
  h1{font-size:23px;margin:0 0 4px;line-height:1.25}
  .sous{color:var(--gris);font-size:14px;margin:0 0 20px}
  .carte{background:var(--carte);border:1px solid var(--ligne);
         border-radius:14px;padding:16px 17px;margin-bottom:13px}
  .quand{font-size:20px;font-weight:800;color:var(--orange);line-height:1.35}
  .ligne{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--ligne)}
  .ligne:first-child{border-top:0;padding-top:0}
  .cle{color:var(--gris);font-size:14px;flex:0 0 96px}
  .val{flex:1;min-width:0;font-size:15px}
  .mentions{white-space:pre-wrap;font-size:15px}
  .regle{font-size:13px;color:var(--gris);border-left:3px solid var(--orange);
         padding-left:11px;margin-top:4px}
  button{
    width:100%;padding:15px;font-size:16px;font-weight:700;cursor:pointer;
    border-radius:12px;border:1px solid var(--ligne);
    background:var(--orange);color:#111;font-family:inherit;
  }
  button:disabled{opacity:.55;cursor:default}
  .fait{background:transparent;color:var(--vert);border-color:var(--vert);font-weight:700}
  .liens{text-align:center;margin-top:22px;font-size:14px}
  .liens a{color:var(--bleu);text-decoration:none;
           border-bottom:1px solid currentColor;padding-bottom:1px}
  .pied{text-align:center;color:var(--gris);font-size:12px;margin-top:26px;line-height:1.7}
  .vide{text-align:center;color:var(--gris);padding:40px 10px;font-size:15px}
</style>
</head>
<body>
<div class="page">
  <div class="marque">Évolution Conduites</div>
  <div id="zone"><div class="vide">Chargement…</div></div>
</div>

<script>
/* L'adresse du Worker : la même que celle de l'application. */
var PROXY = 'https://bilan-proxy.evolutionconduites.workers.dev';

var jeton = (new URLSearchParams(location.search).get('c') || '').trim();
var zone = document.getElementById('zone');

function texte(s){
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

function rien(message){
  zone.innerHTML = '<div class="vide">' + texte(message) +
    '<br><br>Si tu ne retrouves pas ton cours, appelle-nous : ' +
    'nous te redirons tout.</div>';
}

function ligne(cle, valeur){
  if(!valeur) return '';
  return '<div class="ligne"><div class="cle">' + texte(cle) +
         '</div><div class="val">' + texte(valeur) + '</div></div>';
}

function afficher(c){
  var html =
    '<h1>Bonjour ' + texte(c.prenom || '') + ' 👋</h1>' +
    '<p class="sous">Voici le détail de ton prochain cours.</p>' +

    '<div class="carte"><div class="quand">' +
      texte(c.date || '') + (c.heure ? ' à ' + texte(c.heure) : '') +
    '</div></div>' +

    '<div class="carte">' +
      ligne('Rendez-vous', c.lieu) +
      ligne('Véhicule', c.vehicule) +
      ligne('Séance', c.typeSeance) +
      ligne('Avec', c.moniteur) +
    '</div>' +

    (c.mentions
      ? '<div class="carte"><div class="mentions">' + texte(c.mentions) + '</div></div>'
      : '') +

    '<div class="carte"><div class="regle">Si tu as un empêchement, ' +
      'préviens-nous au moins 48 heures à l\'avance : passé ce délai, ' +
      'la leçon est due et sera facturée.</div></div>' +

    '<div id="zoneBouton"></div>' +

    '<div class="liens"><a href="eleve.html">Ton coin révisions →</a></div>' +

    '<div class="pied">Cette page ne concerne que ce cours.<br>' +
      'Elle ne donne accès à rien d\'autre.</div>';

  zone.innerHTML = html;
  poserBouton(c.confirmeLe);
}

function poserBouton(confirmeLe){
  var z = document.getElementById('zoneBouton');
  if(!z) return;

  if(confirmeLe){
    z.innerHTML = '<button class="fait" disabled>✅ Merci, c\'est noté — ' +
                  'tu as confirmé ta présence</button>';
    return;
  }

  z.innerHTML = '<button id="jeViens">✋ Je serai là</button>';
  document.getElementById('jeViens').addEventListener('click', function(){
    var b = this;
    b.disabled = true;
    b.textContent = 'Un instant…';

    /* En POST : un lien qu'un anti-virus ou un aperçu de messagerie
       ouvre tout seul ne doit pas valoir présence annoncée. */
    fetch(PROXY + '/cours', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ c: jeton, confirmer: true })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.confirmeLe) poserBouton(d.confirmeLe);
      else throw new Error(d && d.error ? d.error : 'échec');
    })
    .catch(function(){
      b.disabled = false;
      b.textContent = '✋ Je serai là';
      alert("La confirmation n'est pas passée. Réessaie dans un instant, " +
            "ou préviens-nous directement.");
    });
  });
}

if(!jeton){
  rien('Ce lien est incomplet.');
}else{
  fetch(PROXY + '/cours?c=' + encodeURIComponent(jeton))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.cours) afficher(d.cours);
      else rien((d && d.error) || 'Ce lien a expiré.');
    })
    .catch(function(){
      rien('Impossible de charger ton cours pour le moment.');
    });
}
</script>
</body>
</html>
