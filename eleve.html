<title>Mes procédures — Évolution Conduites</title>

<!-- =========================================================
     ESPACE ÉLÈVE — Évolution Conduites

     L'élève récite une procédure, à la voix ou par écrit. Un
     moniteur la corrige avant qu'il en voie le retour.

     Cette page ne donne accès qu'aux envois de l'élève
     connecté : ni liste d'élèves, ni bilans, ni réglages.
     ========================================================= -->

<style>
  /* La charte de l'application : mêmes variables, mêmes formes.
     L'élève doit reconnaître l'auto-école. */
  :root{
    --navy: #000000;          /* fond de page    */
    --navy-deep: #0B0B0B;     /* fond des cartes */
    --orange: #B6FF0E;        /* accent          */
    --accent-text: #B6FF0E;
    --on-accent: #0B0B0B;
    --orange-soft: #E4FFA8;
    --cream: #F4F4F4;
    --soft: #E0E0E0;
    --muted: #B5B5B5;
    --red: #FF5C33;
    --warn-text: #FFC9BB;
    --warn-bg: rgba(255,92,51,.12);
    --line: #262626;
  }

  body.clair{
    /* Thème clair — le même que l'application */
    --navy: #F2F2EC;
    --navy-deep: #FFFFFF;
    --orange: #B6FF0E;
    --accent-text: #3B6900;   /* le vert vif est illisible sur blanc */
    --on-accent: #0B0B0B;
    --orange-soft: #EEFFC7;
    --cream: #14161B;
    --soft: #2C2F36;
    --muted: #64655F;
    --red: #C33A12;
    --warn-text: #8F2E0E;
    --warn-bg: rgba(195,58,18,.10);
    --line: #DCDCD3;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0; padding:18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    background: var(--navy);
    color: var(--cream);
    font-size:15px; line-height:1.5;
    min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  .boite{ max-width:600px; margin:0 auto; }

  .entete{
    display:flex; align-items:center; gap:11px; margin-bottom:20px;
  }
  .logo{
    width:38px; height:38px; border-radius:9px; flex-shrink:0;
    background: var(--orange); color: var(--on-accent);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; letter-spacing:.02em;
  }
  h1{ font-size:19px; margin:0; font-weight:700; }
  .sous{ font-size:12px; color:var(--muted); margin-top:2px; }

  .card{
    background: var(--navy-deep);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
  }

  .section-title{
    font-size:15px; font-weight:700; margin:0 0 14px;
  }

  label{
    display:block; font-size:12px; color:var(--muted); margin-bottom:6px;
    text-transform:uppercase; letter-spacing:.04em;
  }
  input, select, textarea{
    width:100%;
    background: var(--navy);
    border:1px solid var(--line);
    color: var(--cream);
    padding:11px 12px;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    margin-bottom:14px;
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--orange); outline-offset:1px;
  }
  textarea{ resize:vertical; line-height:1.6; }
  select option{ background: var(--navy-deep); color: var(--cream); }
  input:disabled, select:disabled{ opacity:.55; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 18px; border-radius:10px; border:none;
    font-size:14px; font-weight:700; cursor:pointer; width:100%;
    font-family:inherit; margin-bottom:10px;
  }
  .btn-primary{ background: var(--orange); color: var(--navy-deep); }
  .btn-secondary{
    background:transparent; border:1px solid var(--line); color: var(--cream);
  }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* Le bouton du micro, comme dans l'application */
  .rec-btn{
    width:100%; padding:20px; border:none; border-radius:16px;
    font-size:17px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: var(--orange); color: var(--navy-deep);
    font-family:inherit; margin-bottom:10px;
    transition: background .15s ease;
  }
  .rec-btn.recording{
    background:#1F5C99; color:#fff;
  }

  .message{
    font-size:13px; padding:11px 13px; border-radius:10px; margin-bottom:14px;
    line-height:1.55;
  }
  .message.erreur{ background: var(--warn-bg); color: var(--warn-text); }
  .message.ok{ background: rgba(182,255,14,.10); color: var(--accent-text); }
  .message.attente{ background: rgba(182,255,14,.07); color: var(--muted); }

  .empty{ font-size:13px; color:var(--muted); line-height:1.5; }

  .envoi{
    border:1px solid var(--line); border-radius:12px;
    padding:13px; margin-bottom:8px;
  }
  .envoi .quand{ font-size:11px; color:var(--muted); }
  .envoi .titre{ font-weight:700; margin:2px 0 6px; font-size:14px; }
  .envoi .dit{
    font-size:13px; color:var(--soft); line-height:1.6;
    white-space:pre-wrap; margin-bottom:10px;
  }
  .envoi .retour{
    font-size:14px; line-height:1.65; white-space:pre-wrap;
    border-top:1px solid var(--line); padding-top:10px;
  }

  /* Les retouches du clair, comme dans l'application */
  body.clair input, body.clair select, body.clair textarea{ background:#FBFBF7; }
  body.clair .card{ box-shadow:0 1px 2px rgba(0,0,0,.05); }
  body.clair .rec-btn.recording{ color:#fff; }
  body.clair .message.ok{ background: var(--orange-soft); color: var(--accent-text); }
  body.clair .message.attente{ background:rgba(0,0,0,.04); }

  /* Le bouton du thème, posé dans l'entête */
  .theme{
    margin-left:auto; flex-shrink:0;
    width:38px; height:38px; padding:0; border-radius:10px;
    background:transparent; border:1px solid var(--line);
    color:var(--cream); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .cache{ display:none !important; }
</style>
</head>
<body>

<div class="boite">

  <!-- ===== CONNEXION ===== -->
  <div id="vueConnexion">
    <div class="entete">
      <div class="logo">EC</div>
      <div>
        <h1>Mes procédures</h1>
        <div class="sous">Évolution Conduites</div>
      </div>
      <button class="theme" id="btTheme1" title="Changer de thème">🌙</button>
    </div>

    <div class="card">
      <label for="chNom">Ton prénom et ton nom</label>
      <input type="text" id="chNom" autocomplete="name">

      <label for="chCode">Ton code</label>
      <input type="password" id="chCode" inputmode="numeric" maxlength="6"
             autocomplete="off"
             style="text-align:center;letter-spacing:.4em;font-size:22px;">

      <button class="btn btn-primary" id="btConnexion">Entrer</button>
      <div id="msgConnexion"></div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;">
        Ton code t'est donné par le bureau. Écris ton nom comme il figure
        sur ton dossier.
      </div>
    </div>
  </div>

  <!-- ===== RÉCITER ===== -->
  <div id="vueEleve" class="cache">
    <div class="entete">
      <div class="logo">EC</div>
      <div>
        <h1 id="bonjour">Bonjour</h1>
        <div class="sous">Choisis une procédure, puis récite-la ou écris-la.</div>
      </div>
      <button class="theme" id="btTheme2" title="Changer de thème">🌙</button>
    </div>

    <div class="card">
      <label for="chProc">La procédure</label>
      <select id="chProc"></select>

      <button class="rec-btn" id="btMicro">🎙️ Réciter à voix haute</button>
      <div id="msgMicro" style="font-size:12px;color:var(--muted);
           margin:-4px 0 12px;line-height:1.5;"></div>

      <label for="chTexte">Ce que tu dis</label>
      <textarea id="chTexte" rows="7"
        placeholder="Parle, ou écris directement ici."></textarea>

      <button class="btn btn-primary" id="btEnvoyer">📨 Envoyer pour correction</button>
      <div id="msgEnvoi"></div>
    </div>

    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <strong style="flex:1;min-width:0;font-size:15px;">Mes envois</strong>
        <button class="btn btn-secondary" id="btMaj"
          style="width:auto;padding:8px 12px;font-size:13px;margin:0;">↻</button>
      </div>
      <div id="mesEnvois"></div>
    </div>

    <button class="btn btn-secondary" id="btSortir">Se déconnecter</button>
  </div>

</div>

<script>
(function(){
  'use strict';

  var RELAIS = 'https://bilan-proxy.evolutionconduites.workers.dev';

  var moi = { nom: '', code: '' };
  var procedures = [];

  function $(id){ return document.getElementById(id); }
  function echapper(t){
    return String(t == null ? '' : t).replace(/&/g, '&amp;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function dire(ou, texte, genre){
    var z = $(ou);
    if(!z){ return; }
    if(!texte){ z.innerHTML = ''; return; }
    z.innerHTML = '<div class="message ' + (genre || '') + '">' +
                  echapper(texte) + '</div>';
  }

  function appeler(corps){
    return fetch(RELAIS + '/eleve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corps)
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.error){ throw new Error(d.error); }
        if(d && d.status === 'error'){ throw new Error(d.message || 'Refusé'); }
        return d;
      });
  }


  /* ===== CONNEXION ===== */

  function connecter(){
    var nom = $('chNom').value.trim();
    var code = $('chCode').value.trim();

    if(!nom){ dire('msgConnexion', 'Écris ton prénom et ton nom.', 'erreur'); return; }
    if(code.length < 4){ dire('msgConnexion', 'Ton code fait six chiffres.', 'erreur'); return; }

    $('btConnexion').disabled = true;
    dire('msgConnexion', 'Vérification…', 'attente');

    appeler({ action: 'eleveConnexion', eleve: nom, code: code })
      .then(function(d){
        moi.nom = d.eleve || nom;
        moi.code = code;
        procedures = d.procedures || [];

        /* Le code reste sur l'appareil : le retaper à chaque fois
           découragerait de s'entraîner. */
        try{
          localStorage.setItem('ec_eleve',
            JSON.stringify({ nom: moi.nom, code: code }));
        }catch(e){}

        entrer();
      })
      .catch(function(e){
        dire('msgConnexion', e.message || 'Connexion impossible.', 'erreur');
      })
      .then(function(){ $('btConnexion').disabled = false; });
  }

  function entrer(){
    $('vueConnexion').classList.add('cache');
    $('vueEleve').classList.remove('cache');
    $('bonjour').textContent = 'Bonjour ' + (moi.nom.split(' ')[0] || '');

    $('chProc').innerHTML = procedures.length
      ? procedures.map(function(p){
          return '<option value="' + echapper(p.id) + '">' +
                 echapper(p.nom) + '</option>';
        }).join('')
      : '<option value="">Aucune procédure disponible</option>';

    chargerEnvois();
  }

  function sortir(){
    try{ localStorage.removeItem('ec_eleve'); }catch(e){}
    moi = { nom: '', code: '' };
    $('chCode').value = '';
    $('vueEleve').classList.add('cache');
    $('vueConnexion').classList.remove('cache');
    dire('msgConnexion', '');
  }


  /* ===== LE MICRO ===== */

  var reco = null;
  var enEcoute = false;
  var acquis = '';

  function demarrerMicro(){
    var Moteur = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Moteur){
      dire('msgMicro', '');
      $('msgMicro').textContent = 'Ton navigateur ne sait pas écouter. ' +
        'Écris ta procédure dans la case ci-dessous.';
      return;
    }

    reco = new Moteur();
    reco.lang = 'fr-FR';
    reco.continuous = true;
    reco.interimResults = true;

    acquis = $('chTexte').value;

    reco.onresult = function(ev){
      var enCours = '';
      for(var i = ev.resultIndex; i < ev.results.length; i++){
        var bout = ev.results[i][0].transcript;
        if(ev.results[i].isFinal){ acquis += bout + ' '; }
        else { enCours += bout; }
      }
      $('chTexte').value = acquis + enCours;
    };

    reco.onerror = function(ev){
      $('msgMicro').textContent = (ev.error === 'not-allowed')
        ? "Le micro est refusé. Autorise-le, ou écris ta procédure."
        : 'Le micro s\'est arrêté. Tu peux reprendre ou écrire.';
      arreterMicro();
    };

    /* Le navigateur coupe seul après un silence : on relance tant
       que l'élève n'a pas appuyé sur Terminer. */
    reco.onend = function(){
      if(enEcoute){
        try{ reco.start(); }catch(e){ arreterMicro(); }
      }
    };

    try{
      reco.start();
      enEcoute = true;
      $('btMicro').classList.add('recording');
      $('btMicro').textContent = '⏹️ Terminer';
      $('msgMicro').textContent = 'Je t\'écoute… parle normalement.';
    }catch(e){
      $('msgMicro').textContent = 'Le micro n\'a pas démarré.';
    }
  }

  function arreterMicro(){
    enEcoute = false;
    if(reco){ try{ reco.stop(); }catch(e){} }
    $('btMicro').classList.remove('recording');
    $('btMicro').textContent = '🎙️ Réciter à voix haute';
  }


  /* ===== ENVOYER ===== */

  function envoyer(){
    var texte = $('chTexte').value.trim();
    var sel = $('chProc');
    var nom = sel.options[sel.selectedIndex]
                ? sel.options[sel.selectedIndex].textContent : '';

    if(!texte){
      dire('msgEnvoi', 'Récite ou écris ta procédure avant d\'envoyer.', 'erreur');
      return;
    }
    if(texte.length < 20){
      dire('msgEnvoi', 'C\'est un peu court : détaille ta procédure.', 'erreur');
      return;
    }

    arreterMicro();
    $('btEnvoyer').disabled = true;
    dire('msgEnvoi', 'Envoi…', 'attente');

    appeler({
      action: 'eleveEnvoyer',
      eleve: moi.nom, code: moi.code,
      procedure: nom, texte: texte
    })
      .then(function(){
        dire('msgEnvoi', 'C\'est envoyé. Un moniteur te répondra bientôt : ' +
          'reviens voir dans « Mes envois ».', 'ok');
        $('chTexte').value = '';
        acquis = '';
        chargerEnvois();
      })
      .catch(function(e){
        dire('msgEnvoi', e.message || 'Envoi impossible.', 'erreur');
      })
      .then(function(){ $('btEnvoyer').disabled = false; });
  }


  /* ===== MES ENVOIS ===== */

  function chargerEnvois(){
    var z = $('mesEnvois');
    z.innerHTML = '<div class="empty">Chargement…</div>';

    appeler({ action: 'eleveRecitations', eleve: moi.nom, code: moi.code })
      .then(function(d){
        var liste = d.recitations || [];
        if(!liste.length){
          z.innerHTML = '<div class="empty">Rien d\'envoyé pour l\'instant.<br>' +
            'Ta première procédure t\'attend au-dessus.</div>';
          return;
        }

        z.innerHTML = liste.map(function(r){
          var valide = (r.etat === 'valide');
          return '<div class="envoi">' +
            '<div class="quand">' + echapper(r.envoyeLe) + '</div>' +
            '<div class="titre">' + echapper(r.procedure) + '</div>' +
            '<div class="dit">' + echapper(r.texte) + '</div>' +
            (valide
              ? '<div class="retour">' + echapper(r.correction) + '</div>'
              : '<div class="retour" style="color:var(--accent-text);">' +
                '⏳ En attente de correction par un moniteur.</div>') +
          '</div>';
        }).join('');
      })
      .catch(function(e){
        z.innerHTML = '<div class="message erreur">' +
          echapper(e.message || 'Lecture impossible.') + '</div>';
      });
  }


  /* ===== LE THÈME =====

     Clair par défaut : l'élève s'entraîne souvent en plein jour,
     et beaucoup n'ont jamais réglé de thème. */

  function appliquerTheme(clair){
    document.body.classList.toggle('clair', clair);
    ['btTheme1', 'btTheme2'].forEach(function(id){
      var b = $(id);
      if(b){ b.textContent = clair ? '☀️' : '🌙'; }
    });
    try{ localStorage.setItem('ec_theme_eleve', clair ? 'clair' : 'sombre'); }catch(e){}
  }

  (function initTheme(){
    var clair = true;
    try{
      var garde = localStorage.getItem('ec_theme_eleve');
      if(garde){ clair = (garde === 'clair'); }
    }catch(e){}
    appliquerTheme(clair);
  })();


  /* ===== DÉPART ===== */

  $('btConnexion').addEventListener('click', connecter);
  $('chCode').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ connecter(); }
  });
  $('chNom').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); $('chCode').focus(); }
  });

  $('btMicro').addEventListener('click', function(){
    if(enEcoute){ arreterMicro(); } else { demarrerMicro(); }
  });
  $('btEnvoyer').addEventListener('click', envoyer);
  $('btMaj').addEventListener('click', chargerEnvois);
  $('btSortir').addEventListener('click', sortir);

  ['btTheme1', 'btTheme2'].forEach(function(id){
    var b = $(id);
    if(b){
      b.addEventListener('click', function(){
        appliquerTheme(!document.body.classList.contains('clair'));
      });
    }
  });

  /* Déjà venu sur cet appareil : on reprend sans rien redemander */
  try{
    var garde = JSON.parse(localStorage.getItem('ec_eleve') || 'null');
    if(garde && garde.nom && garde.code){
      moi.nom = garde.nom;
      moi.code = garde.code;
      appeler({ action: 'eleveConnexion', eleve: moi.nom, code: moi.code })
        .then(function(d){
          procedures = d.procedures || [];
          entrer();
        })
        .catch(function(){ sortir(); });
    }
  }catch(e){}
})();
</script>
</body>
</html>
