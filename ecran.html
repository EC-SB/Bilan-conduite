<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Évolution Conduites — Affichage</title>

<!-- ============================================================
     AFFICHAGE DYNAMIQUE — Évolution Conduites

     Deux écrans depuis la même page :
       ?ou=accueil   planning du jour, images, messages, météo
       ?ou=vitrine   images, messages, météo — sans le planning

     Lecture seule. Aucune saisie, aucun bouton : la page tourne
     seule et se recharge toute seule.

     Adresse type :
       ecran.html?t=LE_JETON&ou=accueil&anonyme=1
     ============================================================ -->

<style>
  :root{
    --navy-deep:#0B0E14;
    --navy:#141922;
    --cream:#F4F1E8;
    --muted:#8A94A0;
    --accent:#B6FF0E;
    --orange:#B6FF0E;
    --line:rgba(255,255,255,.10);
    --red:#E5484D;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background:var(--navy-deep);
    color:var(--cream);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    /* Un téléviseur ne se touche pas : pas de sélection ni de curseur */
    user-select:none;
    cursor:none;
  }

  #ecran{ display:flex; flex-direction:column; height:100vh; }

  /* ---------- Bandeau du haut ---------- */
  header{
    display:flex; align-items:center; gap:24px;
    padding:20px 34px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .marque{
    font-size:26px; font-weight:800; letter-spacing:.5px;
    color:var(--accent);
  }
  .jour{ flex:1; font-size:20px; color:var(--muted); text-transform:capitalize; }
  .heure{ font-size:40px; font-weight:800; font-variant-numeric:tabular-nums; }

  /* La météo, discrète mais lisible de loin */
  .meteo{
    display:flex; align-items:center; gap:12px;
    font-size:24px; color:var(--cream);
  }
  .meteo .t{ font-size:34px; font-weight:800; }
  .meteo .ic{ font-size:38px; line-height:1; }

  /* ---------- Corps ---------- */
  main{ flex:1; display:flex; min-height:0; }

  /* Le planning, à gauche, uniquement dans l'accueil */
  #planning{
    width:44%;
    padding:26px 30px;
    border-right:1px solid var(--line);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  #planning h2{
    font-size:22px; color:var(--accent);
    margin-bottom:16px; letter-spacing:.5px;
  }
  .cours{
    display:flex; align-items:center; gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    font-size:26px;
  }
  .cours .h{
    width:96px; flex-shrink:0;
    font-weight:800; color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .cours .h.vide{ color:var(--muted); font-weight:400; font-size:20px; }
  .cours .e{ flex:1; min-width:0; font-weight:700;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cours .m{ font-size:20px; color:var(--muted); flex-shrink:0; }

  /* Le carrousel, à droite — ou en plein écran sur la vitrine */
  #carrousel{ flex:1; position:relative; overflow:hidden; }

  .diapo{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 50px;
    text-align:center;
    opacity:0;
    transition:opacity .8s ease;
  }
  .diapo.vue{ opacity:1; }

  .diapo img{
    max-width:100%; max-height:100%;
    object-fit:contain;
    border-radius:14px;
  }
  .diapo .titre{
    font-size:54px; font-weight:800; line-height:1.2;
    color:var(--accent); margin-bottom:24px;
  }
  .diapo .texte{
    font-size:36px; line-height:1.5;
    max-width:22ch; white-space:pre-wrap;
  }
  /* Une image avec un titre : le titre passe en bandeau */
  .diapo.avec-image .titre{
    position:absolute; left:0; right:0; bottom:0;
    background:rgba(11,14,20,.86);
    font-size:38px; padding:20px 40px; margin:0;
  }

  /* ---------- Repères de bas d'écran ---------- */
  footer{
    display:flex; align-items:center; gap:14px;
    padding:12px 34px;
    border-top:1px solid var(--line);
    font-size:16px; color:var(--muted);
    flex-shrink:0;
  }
  .points{ display:flex; gap:7px; flex:1; }
  .point{
    width:9px; height:9px; border-radius:50%;
    background:var(--line);
    transition:background .3s;
  }
  .point.vu{ background:var(--accent); }

  #souci{ color:var(--red); }

  /* ---------- Vitrine : pas de planning ---------- */
  body.vitrine #planning{ display:none; }
  body.vitrine .diapo .titre{ font-size:70px; }
  body.vitrine .diapo .texte{ font-size:46px; }

  /* ---------- Écran vide ---------- */
  .repos{
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    height:100%; gap:18px;
    color:var(--muted); font-size:30px;
  }
  .repos .gros{ font-size:80px; }
</style>
</head>
<body>

<div id="ecran">
  <header>
    <span class="marque">Évolution Conduites</span>
    <span class="jour" id="jour"></span>
    <span class="meteo" id="meteo"></span>
    <span class="heure" id="heure">--:--</span>
  </header>

  <main>
    <section id="planning">
      <h2>📅 Les cours d'aujourd'hui</h2>
      <div id="listeCours"></div>
    </section>
    <section id="carrousel"></section>
  </main>

  <footer>
    <span class="points" id="points"></span>
    <span id="souci"></span>
  </footer>
</div>

<script>
/* ============================================================
   RÉGLAGES
   ============================================================ */
const PARAMS  = new URLSearchParams(location.search);
const JETON   = PARAMS.get('t') || '';
const OU      = (PARAMS.get('ou') === 'vitrine') ? 'vitrine' : 'accueil';
const ANONYME = PARAMS.get('anonyme') === '1';

const RELAIS  = 'https://bilan-proxy.evolutionconduites.workers.dev';

/* Saint-Brieuc */
const LAT = 48.5136, LON = -2.7653;

/* Toutes les minutes : le planning bouge peu, et un téléviseur qui
   appelle sans cesse finit par saturer le quota. */
const DELAI_DONNEES = 60000;
const DELAI_METEO   = 900000;      /* 15 minutes suffisent */

if(OU === 'vitrine') document.body.classList.add('vitrine');

let diapos = [];
let iDiapo = 0;
let minuteurDiapo = null;


/* ============================================================
   L'HEURE
   ============================================================ */
function majHeure(){
  const d = new Date();
  document.getElementById('heure').textContent =
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0');
  document.getElementById('jour').textContent =
    d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}


/* ============================================================
   LA MÉTÉO

   Open-Meteo, sans clé ni compte. Si elle ne répond pas, la zone
   reste vide : une météo absente ne doit pas vider l'écran.
   ============================================================ */
const CIELS = {
  0:['☀️','Ensoleillé'], 1:['🌤️','Peu nuageux'], 2:['⛅','Nuageux'],
  3:['☁️','Couvert'], 45:['🌫️','Brouillard'], 48:['🌫️','Brouillard givrant'],
  51:['🌦️','Bruine'], 53:['🌦️','Bruine'], 55:['🌦️','Bruine forte'],
  61:['🌧️','Pluie faible'], 63:['🌧️','Pluie'], 65:['🌧️','Forte pluie'],
  66:['🌧️','Pluie verglaçante'], 67:['🌧️','Pluie verglaçante'],
  71:['🌨️','Neige'], 73:['🌨️','Neige'], 75:['❄️','Forte neige'],
  77:['🌨️','Grésil'], 80:['🌦️','Averses'], 81:['🌦️','Averses'],
  82:['⛈️','Fortes averses'], 85:['🌨️','Averses de neige'],
  86:['🌨️','Averses de neige'], 95:['⛈️','Orage'],
  96:['⛈️','Orage et grêle'], 99:['⛈️','Orage et grêle']
};

async function majMeteo(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT +
                          '&longitude=' + LON + '&current=temperature_2m,weather_code' +
                          '&timezone=Europe%2FParis');
    const d = await r.json();
    const c = d && d.current;
    if(!c) return;

    const ciel = CIELS[c.weather_code] || ['', ''];
    document.getElementById('meteo').innerHTML =
      '<span class="ic">' + ciel[0] + '</span>' +
      '<span class="t">' + Math.round(c.temperature_2m) + '°</span>';
  }catch(e){
    /* Pas de météo : le reste continue de tourner */
  }
}


/* ============================================================
   LES DONNÉES
   ============================================================ */
async function chargerContenu(){
  if(!JETON){
    document.getElementById('souci').textContent =
      'Adresse incomplète : il manque le jeton (?t=…)';
    return;
  }

  try{
    const r = await fetch(RELAIS + '/ecran?t=' + encodeURIComponent(JETON) +
                          '&ou=' + OU + (ANONYME ? '&anonyme=1' : ''));
    if(!r.ok){
      document.getElementById('souci').textContent =
        (r.status === 403) ? 'Jeton refusé' : 'Serveur indisponible';
      return;
    }
    const d = await r.json();
    document.getElementById('souci').textContent = '';

    dessinerPlanning((d && d.planning) || []);

    /* On ne relance le carrousel que si le contenu a changé :
       sinon il repartirait de la première image chaque minute. */
    const neuf = JSON.stringify(((d && d.diapos) || []).map(x => x.id + x.titre + x.contenu));
    if(neuf !== signatureDiapos){
      signatureDiapos = neuf;
      diapos = (d && d.diapos) || [];
      iDiapo = 0;
      dessinerPoints();
      lancerCarrousel();
    }
  }catch(e){
    document.getElementById('souci').textContent = 'Hors ligne';
  }
}

let signatureDiapos = '';


/* ============================================================
   LE PLANNING
   ============================================================ */
function dessinerPlanning(liste){
  const z = document.getElementById('listeCours');
  if(!z) return;

  if(!liste.length){
    z.innerHTML = '<div style="font-size:24px;color:var(--muted);padding-top:20px;">' +
                  'Aucun cours prévu aujourd\'hui.</div>';
    return;
  }

  /* Ce qui tient à l'écran : au-delà, on ne lirait plus rien */
  z.innerHTML = liste.slice(0, 11).map(c =>
    '<div class="cours">' +
      '<span class="h' + (c.heure ? '' : ' vide') + '">' +
        (c.heure ? c.heure.replace(':', 'h') : '—') + '</span>' +
      '<span class="e">' + echapper(c.eleve) + '</span>' +
      '<span class="m">' + echapper(c.moniteur || '') + '</span>' +
    '</div>').join('');

  if(liste.length > 11){
    z.innerHTML += '<div style="font-size:20px;color:var(--muted);padding-top:12px;">' +
                   '+ ' + (liste.length - 11) + ' autre(s)</div>';
  }
}

function echapper(t){
  return String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
}


/* ============================================================
   LE CARROUSEL
   ============================================================ */
function dessinerPoints(){
  document.getElementById('points').innerHTML =
    diapos.map(() => '<span class="point"></span>').join('');
}

function lancerCarrousel(){
  clearTimeout(minuteurDiapo);
  const z = document.getElementById('carrousel');

  if(!diapos.length){
    z.innerHTML = '<div class="repos"><span class="gros">🚗</span>' +
                  '<span>Bonne route à tous</span></div>';
    return;
  }
  afficherDiapo();
}

function afficherDiapo(){
  const z = document.getElementById('carrousel');
  const d = diapos[iDiapo % diapos.length];
  if(!d) return;

  const avecImage = !!d.image;
  const el = document.createElement('div');
  el.className = 'diapo' + (avecImage ? ' avec-image' : '');

  el.innerHTML =
    (avecImage ? '<img src="' + d.image + '" alt="">' : '') +
    (d.titre ? '<div class="titre">' + echapper(d.titre) + '</div>' : '') +
    (d.contenu && !avecImage
      ? '<div class="texte">' + echapper(d.contenu) + '</div>' : '');

  z.innerHTML = '';
  z.appendChild(el);
  requestAnimationFrame(() => el.classList.add('vue'));

  /* Les points du bas */
  const pts = document.querySelectorAll('.point');
  pts.forEach((p, i) => p.classList.toggle('vu', i === (iDiapo % diapos.length)));

  minuteurDiapo = setTimeout(() => {
    iDiapo = (iDiapo + 1) % diapos.length;
    afficherDiapo();
  }, Math.max(4, d.duree || 12) * 1000);
}


/* ============================================================
   DÉMARRAGE
   ============================================================ */
majHeure();
setInterval(majHeure, 10000);

majMeteo();
setInterval(majMeteo, DELAI_METEO);

chargerContenu();
setInterval(chargerContenu, DELAI_DONNEES);

/* Un téléviseur reste allumé des heures : on recharge la page une
   fois par nuit pour repartir sur un pied neuf. */
setInterval(() => {
  const h = new Date().getHours();
  if(h === 4) location.reload();
}, 3600000);
</script>

</body>
</html>
