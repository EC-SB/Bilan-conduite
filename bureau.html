<!-- ============================================================
     bureau.html — 📍 LA PAGE D'UN BUREAU (QR code de la vitrine)

     David, le 13 octobre : « il me faudrait quelque chose sur ma
     vitrine pour que les gens voient les heures d'ouverture et
     puissent prendre un rendez-vous quand ils veulent passer au
     bureau ».

     Publiée deux fois par l'action « coin-revisions » :
       eleve.evolutionconduites.fr/loudeac/
       eleve.evolutionconduites.fr/saint-brieuc/
     Le bureau se lit dans l'adresse ; « ?b=loudeac » sert à
     l'essayer ailleurs.

     · ouvert ou fermé maintenant, la prochaine ouverture, l'adresse
       et le téléphone ;
     · les horaires, semaine par semaine (trois semaines) ;
     · le rendez-vous en trois temps : le jour, l'heure (30 minutes,
       un par créneau), la personne et son motif — si la prise de
       rendez-vous est ouverte pour ce bureau ;
     · « ?annuler=… », le lien du mail : on montre le rendez-vous, et
       c'est un appui qui l'annule (jamais l'ouverture du lien).
     · 💬 v1171 — « Écrire au bureau » : une discussion en direct avec
       le bureau, sans compte. Prénom, téléphone et mail obligatoires ;
       du texte seul. « ?discussion=… », le lien du mail de réponse, la
       rouvre.

     « Vous » : des parents et des inconnus la lisent.
     Rien n'est gardé sur l'appareil, sauf le thème et, s'il écrit au
     bureau, le jeton de SA discussion (« ec_vitrine_<bureau> ») : sans
     lui, il ne la retrouverait pas en revenant sur la page.
     ============================================================ -->
<style>

<body class="clair">
<div class="boite">
  <div class="entete">
    <div class="logo">EC</div>
    <div><h1 id="titre">Bureau</h1><div class="sous">Évolution Conduites</div></div>
    <div class="boutentete"><button class="rondentete" id="btTheme" title="Changer de thème">☀️</button></div>
  </div>
  <div id="ecran"><div class="card"><div class="empty">Chargement…</div></div></div>
</div>

<script>
(function(){
  'use strict';
  var RELAIS = 'https://bilan-proxy.evolutionconduites.workers.dev';
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- le thème : clair par défaut, comme l'espace élève ---------- */
  function appliquerTheme(clair){
    document.body.classList.toggle('clair', clair);
    $('btTheme').textContent = clair ? '☀️' : '🌙';
    try{ localStorage.setItem('ec_theme_eleve', clair ? 'clair' : 'sombre'); }catch(e){}
  }
  (function(){
    var clair = true;
    try{ var g = localStorage.getItem('ec_theme_eleve'); if(g) clair = (g === 'clair'); }catch(e){}
    appliquerTheme(clair);
  })();
  $('btTheme').addEventListener('click', function(){ appliquerTheme(!document.body.classList.contains('clair')); });

  /* ---------- quel bureau : l'adresse le dit ---------- */
  var adresse = new URL(location.href);
  var bureau = adresse.searchParams.get('b') || '';
  if(!bureau){
    var m = location.pathname.match(/\/(loudeac|saint-brieuc)(\/|$)/);
    bureau = m ? m[1] : '';
  }
  var jetonAnnuler = adresse.searchParams.get('annuler') || '';

  /* 💬 Le jeton de SA discussion. Celui du mail (« ?discussion= »)
     est gardé puis retiré de l'adresse : une adresse se partage, se
     copie, reste dans l'historique. */
  var CLE_JETON = 'ec_vitrine_' + bureau;
  function lireJeton(){ try{ return localStorage.getItem(CLE_JETON) || ''; }catch(e){ return ''; } }
  function poserJeton(j){ try{ localStorage.setItem(CLE_JETON, j); }catch(e){} jetonEnMemoire = j; }
  function oublierJeton(){ try{ localStorage.removeItem(CLE_JETON); }catch(e){} jetonEnMemoire = ''; }
  var jetonEnMemoire = lireJeton();
  function jeton(){ return lireJeton() || jetonEnMemoire; }
  var ouvrirLaDiscussion = false;
  (function(){
    var d = adresse.searchParams.get('discussion') || '';
    if(/^[A-Za-z0-9]{32}$/.test(d)){ poserJeton(d); ouvrirLaDiscussion = true; }
    if(adresse.searchParams.has('discussion')){
      adresse.searchParams.delete('discussion');
      try{ history.replaceState(null, '', adresse.pathname + (adresse.search || '')); }catch(e){}
    }
  })();

  /* ---------- petites aides ---------- */
  function el(tag, classe, texte){
    var e = document.createElement(tag);
    if(classe) e.className = classe;
    if(texte != null) e.textContent = texte;
    return e;
  }
  function date(iso){
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)) : null;
  }
  function jourLong(iso){
    var d = date(iso);
    return d ? d.toLocaleDateString('fr-FR', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' }) : '';
  }
  function majuscule(t){ return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function heure(h){ return String(h || '').replace(/^0(\d)/, '$1').replace(':', 'h'); }
  function plages(pl){ return (pl || []).map(function(p){ return heure(p[0]) + ' – ' + heure(p[1]); }).join(' · '); }
  function plus(iso, n){
    var d = date(iso); if(!d) return '';
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  var donnees = null;
  var choix = { jour: '', heure: '', motif: '' };
  var semaine = 0;

  function ecran(){ arreterLeDirect(); arreterLeCompteur(); var e = $('ecran'); e.innerHTML = ''; return e; }
  function erreur(texte){
    var e = ecran();
    var c = el('div', 'card');
    c.appendChild(el('div', 'message erreur', texte));
    var b = el('button', 'btn btn-secondary', 'Réessayer');
    b.addEventListener('click', charger);
    c.appendChild(b);
    e.appendChild(c);
  }

  async function lire(){
    var u = RELAIS + '/bureau?b=' + encodeURIComponent(bureau) + (jetonAnnuler ? '&annuler=' + encodeURIComponent(jetonAnnuler) : '');
    var r = await fetch(u, { cache: 'no-store' });
    return r.json();
  }
  async function ecrire(corps){
    var r = await fetch(RELAIS + '/bureau', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                              body: JSON.stringify(corps) });
    return r.json();
  }

  async function charger(){
    if(!bureau){ erreur('Cette page ne connaît pas ce bureau.'); return; }
    try{
      donnees = await lire();
    }catch(e){
      erreur('La page ne répond pas. Vérifiez votre connexion, puis réessayez.');
      return;
    }
    if(!donnees || donnees.status !== 'ok'){ erreur((donnees && donnees.message) || 'Cette page ne connaît pas ce bureau.'); return; }
    var b = donnees.bureau || {};
    $('titre').textContent = b.titre || 'Bureau';
    document.title = (b.titre || 'Bureau') + ' — Évolution Conduites';
    if(jetonAnnuler) return ecranAnnuler();
    if(ouvrirLaDiscussion && jeton()){ ouvrirLaDiscussion = false; return ecranDiscussion(); }
    if(!donnees.actif) return ecranCoupe();
    accueil();
  }

  function coordonnees(c, b, avecItineraire){
    var a = el('div', 'rvAdr');
    /* Avec « Itinéraire », la ville suffit : le code postal faisait
       passer le lien à la ligne sur un téléphone. */
    a.appendChild(el('span', '', '📍 ' + (avecItineraire ? String(b.adresse).replace(/,\s*\d{5}\s+/, ', ') : b.adresse)));
    if(avecItineraire){
      var it = el('a', '', 'Itinéraire ›');
      it.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.adresse);
      it.target = '_blank'; it.rel = 'noopener';
      a.appendChild(it);
    }
    c.appendChild(a);
    var t = el('div', 'rvAdr suite');
    t.appendChild(el('span', '', '📞 ' + b.tel));
    var ap = el('a', '', 'Appeler ›');
    ap.href = 'tel:' + String(b.tel || '').replace(/[^\d+]/g, '');
    t.appendChild(ap);
    c.appendChild(t);
  }

  /* ---------- la page coupée ---------- */
  function ecranCoupe(){
    var b = donnees.bureau;
    var e = ecran();
    var c = el('div', 'card rvOk');
    c.appendChild(el('div', 'gros', '📵'));
    c.appendChild(el('b', '', 'Cette page n’est pas active pour le moment'));
    c.appendChild(el('div', 'rvNote', 'Pour nous joindre ou passer au bureau :'));
    var z = el('div');
    z.style.textAlign = 'left';
    coordonnees(z, b, false);
    z.firstChild.style.borderTop = '0';
    c.appendChild(z);
    e.appendChild(c);
    /* Une discussion déjà commencée continue, page coupée ou non */
    if(jeton()) boutonDiscussion(e);
  }

  /* ---------- l'accueil : ouvert ou fermé, les horaires ---------- */
  function joursAvecCreneaux(){
    var c = donnees.creneaux || {};
    return Object.keys(c).sort().filter(function(j){ return c[j].some(function(x){ return !x.pris; }); });
  }

  function accueil(){
    var d = donnees, b = d.bureau;
    var e = ecran();
    var c = el('div', 'card');
    var et = el('div', 'rvEtat');

    var l = el('div', 'rvJours');

    d.jours.forEach(function(j){
      if(j.jour < debut || j.jour > fin) return;
      if(semaine === 0 && j.jour < d.aujourdhui) return;
      /* Le dimanche fermé n'apprend rien à personne */
      if(!j.ouvert && !j.excep && date(j.jour).getUTCDay() === 0) return;
      var auj = j.jour === d.aujourdhui;
      var r = el('div', 'rvJ' + (auj ? ' auj' : ''));
      r.appendChild(el('span', '', auj ? 'Aujourd’hui, ' + jourLong(j.jour).replace(/\s\S+$/, '')

      r.appendChild(el('span', 'h' + (j.ouvert ? '' : (j.excep ? ' excep' : ' ferme')),

      l.appendChild(r);

                 'votre espace Drivup : ici, c’est pour passer au bureau.');

      e.appendChild(n);

  function agenda(r, b){
    var deb = r.jour.replace(/-/g, '') + 'T' + r.heure.replace(':', '') + '00';
    var m = parseInt(r.heure.slice(0, 2), 10) * 60 + parseInt(r.heure.slice(3), 10) + (donnees.duree || 30);
    var fin = r.jour.replace(/-/g, '') + 'T' + String(Math.floor(m / 60)).padStart(2, '0') + String(m % 60).padStart(2, '0') + '00';
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Evolution Conduites//Bureau//FR', 'BEGIN:VEVENT',
      'UID:' + r.id + '@evolutionconduites.fr', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
      'DTSTART;TZID=Europe/Paris:' + deb, 'DTEND;TZID=Europe/Paris:' + fin,
      'SUMMARY:Rendez-vous — ' + b.titre, 'LOCATION:' + b.adresse.replace(/,/g, '\\,'),
      'DESCRIPTION:' + r.motif + ' — Évolution Conduites\\, ' + b.tel, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = 'rendez-vous-bureau.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ---------- 🔴 v1173 — « le bureau vous a répondu » ----------
     David : « un compteur sur Reprendre la discussion, pour qu'il
     voie qu'on a répondu ». Lu à l'arrivée, puis toutes les
     30 secondes tant que la page est sous les yeux ; le compte ne
     marque rien comme lu. */
  var minuteurCompteur = null;
  var titreDeLaPage = '';
  function arreterLeCompteur(){
    clearInterval(minuteurCompteur); minuteurCompteur = null;
    if(titreDeLaPage) document.title = titreDeLaPage;
  }
  function lancerLeCompteur(){
    clearInterval(minuteurCompteur);
    titreDeLaPage = titreDeLaPage || document.title.replace(/^\(\d+\)\s*/, '');
    compter();
    minuteurCompteur = setInterval(function(){ if(!document.hidden) compter(); }, 30000);
  }
  async function compter(){
    var r = null;
    try{ r = await ecrire({ quoi: 'nonlus', d: jeton() }); }catch(err){ return; }
    var b = $('vtReprendre'), n = $('vtReprendreNote');
    if(!b || !r || r.status !== 'ok') return;
    if(r.etat === 'inconnue'){
      oublierJeton();
      arreterLeCompteur();
      if(donnees && donnees.actif && donnees.discussion){
        b.textContent = '💬 Écrire au bureau';
        if(n){ n.className = 'rvNote'; n.textContent = 'Une question ? Le bureau vous répondra dès que possible.'; }
      }else{ b.remove(); if(n) n.remove(); }
      return;
    }
    var k = Number(r.nonLus || 0);
    b.textContent = '💬 Reprendre la discussion avec le bureau';
    if(k){
      b.appendChild(document.createTextNode(' '));
      b.appendChild(el('span', 'vtBadge', String(k > 9 ? '9+' : k)));
    }
    if(n){
      n.className = 'rvNote' + (k ? ' vtRepondu' : '');
      n.textContent = k ? (k > 1 ? '🔴 Le bureau vous a répondu (' + k + ' messages).' : '🔴 Le bureau vous a répondu.')
                        : r.etat === 'close' ? 'Le bureau a clos cette discussion : vous pouvez la relire, ou en commencer une nouvelle.'
                        : 'Vos messages et les réponses du bureau sont gardés ici.';
    }
    document.title = (k ? '(' + k + ') ' : '') + titreDeLaPage;
  }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && minuteurCompteur) compter(); });

  function retourAccueil(){
    if(donnees && donnees.actif) accueil(); else if(donnees) ecranCoupe(); else charger();

  /* ---------- la discussion ---------- */
  var fil = null, brouillon = '', direct = null;

  function jourDuMessage(envoyeLe){
    var m = String(envoyeLe || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? m[3] + '-' + m[2] + '-' + m[1] : '';
  }
  function libelleDuJour(iso){
    var auj = (donnees && donnees.aujourdhui) || '';
    if(!auj){
      var n = new Date();
      auj = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
    }
    if(iso === auj) return 'Aujourd’hui';
    if(iso === plus(auj, -1)) return 'Hier';
    return jourLong(iso);
  }

  function bulle(m){
    var b = el('div', 'bulle ' + m.de);
    if(m.de === 'eux' && m.auteur) b.appendChild(el('span', 'sig', m.auteur));
    if(m.texte) b.appendChild(document.createTextNode(m.texte));
    var p = m.piece;
    if(p && p.lien){
      var type = String(p.type || '');
      if(/^image\//.test(type)){
        var im = document.createElement('img'); im.src = p.lien; im.alt = 'Photo envoyée par le bureau'; im.loading = 'lazy';
        b.appendChild(im);
      }else if(/^audio\//.test(type)){
        var au = document.createElement('audio'); au.controls = true; au.preload = 'none'; au.src = p.lien; b.appendChild(au);
      }else if(/^video\//.test(type)){
        var vi = document.createElement('video'); vi.controls = true; vi.preload = 'metadata'; vi.playsInline = true; vi.src = p.lien;
        b.appendChild(vi);
      }else{
        var a = el('a', '', '📎 ' + (p.nom || 'Ouvrir le fichier'));
        a.href = p.lien; a.target = '_blank'; a.rel = 'noopener';
        b.appendChild(a);
      }
    }
    if(m.de !== 'systeme') b.appendChild(el('span', 'hh', String(m.envoyeLe || '').slice(11, 16)));
    return b;
  }

  function dessinerLeFil(garderLaPlace){
    var f = fil || {};
    var b = (donnees && donnees.bureau) || f.bureau || {};
    var zoneAvant = $('vtFil');
    var enBas = !zoneAvant || (zoneAvant.scrollHeight - zoneAvant.scrollTop - zoneAvant.clientHeight < 40);
    var ta0 = $('vtTexte');
    var avaitLeFocus = ta0 && document.activeElement === ta0;
    var e = $('ecran'); e.innerHTML = '';
    var c = el('div', 'card ckp');

    var tete = el('div', 'ckTop');
    var ret = el('button', 'rond', '←');
    ret.title = 'Revenir aux horaires'; ret.setAttribute('aria-label', 'Revenir aux horaires');
    ret.addEventListener('click', function(){ arreterLeDirect(); retourAccueil(); });
    tete.appendChild(ret);
    tete.appendChild(el('div', 'av', '🏢'));
    var tt = el('div', 'tt');
    tt.appendChild(el('div', 't', b.titre || 'Bureau'));
    var s = el('div', 's');
    var msgs = f.messages || [];
    var miens = msgs.filter(function(m){ return m.de === 'moi'; });
    var dernier = miens.length ? miens[miens.length - 1].rang : 0;
    if(f.etat === 'ouverte'){
      var dot = el('span', 'ckDot'); s.appendChild(dot);
      s.appendChild(document.createTextNode(dernier && f.luBureau >= dernier ? '✓✓ lu par le bureau'
                                                                             : 'Le bureau vous répondra dès que possible'));
    }else s.textContent = 'Évolution Conduites';
    tt.appendChild(s);
    tete.appendChild(tt);
    c.appendChild(tete);

    if(f.etat === 'ouverte' || f.etat === 'close'){
      var z = el('div', 'fil'); z.id = 'vtFil';
      var jourAvant = '';
      msgs.forEach(function(m, i){
        var j = jourDuMessage(m.envoyeLe);
        if(j && j !== jourAvant){
          var jf = el('div', 'jourFil'); jf.appendChild(el('span', '', libelleDuJour(j))); z.appendChild(jf);
          jourAvant = j;
        }
        if(m.de !== 'eux'){ z.appendChild(bulle(m)); return; }
        var suiv = msgs[i + 1];
        var dernierDuGroupe = !suiv || suiv.de !== 'eux' || suiv.auteur !== m.auteur || jourDuMessage(suiv.envoyeLe) !== j;
        var r = el('div', 'rangEux');
        r.appendChild(el('span', 'avSlot' + (dernierDuGroupe ? ' plein' : ''), dernierDuGroupe ? String(m.auteur || 'B').charAt(0).toUpperCase() : ''));
        r.appendChild(bulle(m));
        z.appendChild(r);
      });
      if(!msgs.length) z.appendChild(el('div', 'vtFin', 'Pas encore de message.'));
      c.appendChild(z);
    }

    if(f.etat === 'ouverte'){
      var ze = el('div', 'zoneEcrire');
      var ta = document.createElement('textarea');
      ta.id = 'vtTexte'; ta.rows = 2; ta.maxLength = 1000; ta.placeholder = 'Votre message…'; ta.value = brouillon;
      ta.setAttribute('aria-label', 'Votre message');
      var envoyer = el('button', 'btn', 'Envoyer ➤');
      envoyer.id = 'vtEnvoyer';
      envoyer.disabled = !brouillon.trim();
      ta.addEventListener('input', function(){ brouillon = ta.value; envoyer.disabled = !brouillon.trim(); });
      ta.addEventListener('keydown', function(ev){ if(ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) envoyer.click(); });
      envoyer.addEventListener('click', async function(){
        var texte = brouillon.trim();
        if(!texte) return;
        envoyer.disabled = true; ta.disabled = true;
        var r;
        try{ r = await ecrire({ quoi: 'ecrire', d: jeton(), texte: texte }); }
        catch(err){ r = { status: 'error', message: 'La page ne répond pas. Vérifiez votre connexion, puis réessayez.' }; }
        ta.disabled = false;
        if(r && r.status === 'ok'){ brouillon = ''; await relire(true); var t2 = $('vtTexte'); if(t2) t2.focus(); return; }
        envoyer.disabled = false;
        if(r && r.etat){ await relire(true); return; }
        var er = el('div', 'message erreur', (r && r.message) || 'Le message n’est pas parti.');
        er.style.margin = '10px 0 0';
        ze.appendChild(er);
      });
      ze.appendChild(ta);
      var ou = el('div', 'zoneOutils');
      ou.appendChild(el('div', 'rvNote', 'Le bureau vous répondra dès que possible.'));
      ou.appendChild(envoyer);
      ze.appendChild(ou);
      c.appendChild(ze);
    }else{
      var fin = el('div', 'vtFin');
      var nouvelle = false;
      if(f.etat === 'close'){
        fin.appendChild(el('b', '', '✓ Le bureau a clos cette discussion'));
        fin.appendChild(document.createTextNode('Une autre question ? Commencez une nouvelle discussion.'));
        nouvelle = true;
      }else if(f.etat === 'rattachee'){
        fin.appendChild(el('b', '', '🔗 Cette discussion continue dans votre espace élève'));
        fin.appendChild(document.createTextNode('Le bureau l’a rangée dans votre dossier : retrouvez-la dans « 💬 Messages ».'));
        var lien = el('a', 'btn btn-primary', '🎓 Ouvrir mon espace élève');
        lien.href = 'https://eleve.evolutionconduites.fr/';
        lien.style.marginTop = '14px';
        fin.appendChild(lien);
      }else if(f.etat === 'bloquee'){
        fin.appendChild(el('b', '', 'Le bureau ne reçoit plus vos messages ici'));
        fin.appendChild(document.createTextNode('Pour nous joindre, appelez le ' + (b.tel || 'bureau') + '.'));
      }else{
        fin.appendChild(el('b', '', 'Cette discussion n’est plus disponible'));
        fin.appendChild(document.createTextNode('Une discussion est effacée un mois après son dernier message.'));
        nouvelle = true;
      }
      c.appendChild(fin);
      if(nouvelle && donnees && donnees.actif && donnees.discussion){
        var nb = el('button', 'btn btn-primary', '💬 Nouvelle discussion');
        nb.style.marginTop = '14px';
        nb.addEventListener('click', function(){ oublierJeton(); fil = null; ecranEcrire(); });
        c.appendChild(nb);
      }
    }
    e.appendChild(c);
    var zf = $('vtFil');
    if(zf && (enBas || !garderLaPlace)) zf.scrollTop = zf.scrollHeight;
    if(avaitLeFocus && $('vtTexte')) $('vtTexte').focus();
  }

  var relectureEnCours = false;
  async function relire(force){
    if(relectureEnCours && !force) return;
    relectureEnCours = true;
    var r = null;
    try{ r = await ecrire({ quoi: 'fil', d: jeton() }); }catch(e){ r = null; }
    relectureEnCours = false;
    if(!r || r.status !== 'ok') return null;
    var avant = JSON.stringify(fil || {});
    fil = r;
    if(r.etat === 'inconnue') oublierJeton();
    if(!$('vtFil') && !$('vtTexte') && direct === null) return r;   /* on a quitté l'écran */
    if(JSON.stringify(fil) !== avant || force) dessinerLeFil(true);
    if(r.etat !== 'ouverte') arreterLeDirect();
    return r;
  }

  async function ecranDiscussion(){
    var e = ecran();
    var c = el('div', 'card ckp');
    c.appendChild(el('div', 'empty', 'Chargement de la discussion…'));
    e.appendChild(c);
    direct = { ws: null, minuteur: null, ping: null, fini: false };
    var d = direct;
    var r = await relire(true);
    if(d.fini) return;
    if(!r){
      arreterLeDirect();
      c.innerHTML = '';
      c.appendChild(el('div', 'message erreur', 'La discussion ne se charge pas. Vérifiez votre connexion, puis réessayez.'));
      var re = el('button', 'btn btn-primary', 'Réessayer');
      re.addEventListener('click', ecranDiscussion);
      var rt = el('button', 'btn btn-secondary', '‹ Retour aux horaires');
      rt.addEventListener('click', retourAccueil);
      c.append(re, rt);
      return;
    }
    if(r.etat === 'ouverte') brancherLeDirect(d);
  }

  /* Le direct : la même liaison que la messagerie. Sans elle, ou si
     elle tombe, on relit toutes les cinq secondes. */
  function brancherLeDirect(d){
    var sonder = function(ms){
      clearInterval(d.minuteur);
      d.minuteur = setInterval(function(){ if(!document.hidden) relire(false); }, ms);
    };
    sonder(5000);
    ecrire({ quoi: 'direct', d: jeton() }).then(function(r){
      if(d.fini || !r || r.status !== 'ok' || !r.billet || typeof WebSocket !== 'function') return;
      var ws;
      try{ ws = new WebSocket(RELAIS.replace(/^http/, 'ws') + '/ws?b=' + encodeURIComponent(r.billet)); }catch(e){ return; }
      d.ws = ws;
      ws.onopen = function(){
        sonder(30000);
        d.ping = setInterval(function(){ try{ ws.send('ping'); }catch(e){} }, 45000);
      };
      ws.onmessage = function(ev){ if(String(ev.data) !== 'pong') relire(false); };
      ws.onclose = function(){
        clearInterval(d.ping);
        if(d.fini) return;
        sonder(5000);
        /* On retente le direct un peu plus tard : un téléphone qui
           sort de veille a perdu sa connexion. */
        setTimeout(function(){ if(!d.fini && d.ws === ws) brancherLeDirect(d); }, 15000);
      };
    }).catch(function(){});
  }

  function arreterLeDirect(){
    var d = direct;
    direct = null;
    if(!d) return;
    d.fini = true;
    clearInterval(d.minuteur); clearInterval(d.ping);
    if(d.ws){ try{ d.ws.close(); }catch(e){} }
  }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && direct) relire(false); });

  charger();
})();
</script>
