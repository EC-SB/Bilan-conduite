<!DOCTYPE html>
<!-- Déployé le 16/09/2026 à 10:24 — v1012 -->
<!-- ============================================================
     LE TRAJET DU COURS, EN GRAND — v1002

     David, en regardant la carte de son mail : « je ne suis pas
     sûr que ce soit assez précis là avec juste une image ».

     Une image tient dans un mail et se lit sans rien ouvrir : elle
     reste. Mais elle est figée, et huit kilomètres sur six cent
     quarante pixels font douze mètres par pixel. Cette page-ci est
     l'autre moitié : le même tracé, mais où l'élève peut zoomer
     jusqu'au nom de sa rue.

     ⚠️ TOUT EST DANS LE LIEN, RIEN N'EST STOCKÉ ICI.

     Le tracé arrive encodé dans l'adresse. Cette page n'interroge
     aucun classeur, ne connaît aucun élève, ne pose aucun cookie
     et n'écrit rien nulle part. Elle ne sait pas de qui est ce
     trajet — elle n'a qu'une suite de points. Un lien qui porte
     son contenu meurt avec le mail qui le transportait : rien à
     effacer, rien à faire fuir, rien à deviner en changeant un
     numéro dans l'adresse.

     ⚠️ ET « no-referrer », CE N'EST PAS UN DÉTAIL. Sans cette
     ligne, le navigateur annoncerait l'adresse COMPLÈTE de la page
     — donc le trajet — à chaque serveur d'où vient un fichier.
     Une donnée personnelle partirait chez un tiers pour aller
     chercher une feuille de style.

     ⚠️ AUCUNE VITESSE, ICI NON PLUS. Un trait, des pastilles, une
     distance, une durée. La CNIL interdit d'utiliser un dispositif
     de géolocalisation pour contrôler le respect des limitations
     de vitesse, et cette page ne saurait pas en calculer une : les
     horodatages des points ne sont pas dans le lien.
     ============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notre trajet — Évolution Conduites</title>
<style>
  :root{
    --vert:#3B6900; --encre:#14161B; --gris:#64655F;
    --bord:#DCDCD3; --fond:#F6F5F0;
    --hautDuTel: env(safe-area-inset-top, 0px);
    --basDuTel: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--fond); color:var(--encre);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
         Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
    padding-top:var(--hautDuTel); padding-bottom:var(--basDuTel);
  }
  header{
    padding:14px 16px 12px; border-bottom:1px solid var(--bord);
    background:#fff; flex:0 0 auto;
  }
  h1{ margin:0 0 3px; font-size:16px; font-weight:800; color:var(--vert); }
  .chiffres{ font-size:13px; color:var(--gris); }
  /* La carte prend tout ce qui reste : sur un téléphone tenu
     debout, c'est elle qu'on est venu voir. */
  #carte{ flex:1 1 auto; min-height:240px; background:var(--fond); }
  .liste{
    flex:0 0 auto; max-height:34vh; overflow-y:auto;
    background:#fff; border-top:1px solid var(--bord);
  }
  .repere{
    display:flex; gap:10px; align-items:baseline;
    padding:9px 16px; border-bottom:1px solid var(--bord);
    font-size:14px;
  }
  .repere:last-child{ border-bottom:0; }
  .num{
    flex:0 0 auto; min-width:22px; height:22px; border-radius:11px;
    background:var(--vert); color:#fff; font-weight:700; font-size:12px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .heure{ color:var(--gris); font-size:12.5px; flex:0 0 auto; }
  .detail{ padding:0 16px 12px 48px; font-size:13.5px; line-height:1.55;
           border-bottom:1px solid var(--bord); }
  .dit{ color:var(--encre); margin-bottom:3px; }
  .question{ color:var(--gris); font-size:13px; margin-top:2px; }
  .question:first-of-type{ margin-top:9px; }
  .nom{ color:var(--encre); }
  .pied{
    padding:11px 16px calc(11px + var(--basDuTel));
    font-size:11.5px; color:var(--gris); line-height:1.55;
    background:#fff; border-top:1px solid var(--bord); flex:0 0 auto;
  }
  .vide{
    padding:40px 22px; text-align:center; color:var(--gris);
    font-size:14px; line-height:1.6;
  }
  /* Les pastilles du tracé, dessinées par Leaflet */
  .pastille{
    background:var(--vert); color:#fff; border:2px solid #fff;
    border-radius:50%; width:26px; height:26px; font-weight:700;
    font-size:12px; display:flex; align-items:center;
    justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .bout{
    border:2.5px solid #3B3B3B; background:#fff; border-radius:50%;
    width:15px; height:15px; box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .bout.arrivee{ border-radius:2px; background:#14161B; border-color:#fff; }
  @media (prefers-color-scheme: dark){
    :root{ --fond:#1A1C18; --encre:#F2F2EC; --bord:#33352E; --gris:#A3A49C; }
    header,.liste,.pied{ background:#212319; }
    .nom{ color:var(--encre); }
  }
</style>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>

<header>
  <h1>🗺️ Notre trajet</h1>
  <div class="chiffres" id="chiffres">—</div>
</header>

<div id="carte"></div>
<div class="liste" id="liste"></div>

<div class="pied">
  Les points numérotés sont les endroits que ton moniteur a marqués pendant
  le cours : ce sont tes points de travail pour la prochaine fois. Le tracé
  est indicatif, il ne dit rien de ta façon de conduire.<br>
  Plan IGNV2 — Carte © IGN/Géoportail.
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ⚠️ LE DÉCODAGE EST LA COPIE EXACTE DE L'ENCODAGE.

   « encoderPolyligne » vit dans ec-trajet.js et écrit le format
   polyligne de Google (différences en cinquièmes de degré, base 64
   par tranches de cinq bits). Si les deux ne disent pas exactement
   la même chose, le trajet apparaît en Afrique et personne ne
   comprend pourquoi. Le Worker en a déjà une troisième copie pour
   ses propres besoins — c'est une dette connue, et c'est pour ça
   que le test fait écrire l'un et relire l'autre. */
function decoderPolyligne(str){
  const pts = [];
  let i = 0, lat = 0, lon = 0;
  while(i < str.length){
    let r = 0, d = 0, b;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << d; d += 5; }
    while(b >= 0x20);
    lat += ((r & 1) ? ~(r >> 1) : (r >> 1));
    r = 0; d = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << d; d += 5; }
    while(b >= 0x20);
    lon += ((r & 1) ? ~(r >> 1) : (r >> 1));
    pts.push([lat / 1e5, lon / 1e5]);
  }
  return pts;
}

/* ⚠️ LA MÊME TABLE QUE LE MODULE — v1004.

   « NATURES_DU_POINT » vit dans ec-trajet.js ; la voici une seconde
   fois, parce que cette page ne charge pas l'application. Les deux
   copies DOIVENT dire la même chose : une pastille rouge ici en
   face d'un point vert dans le mail, et l'élève ne sait plus
   laquelle croire. Le test compare les deux tables couleur par
   couleur — c'est la seule chose qui les tient ensemble. */
const NATURES = {
  repere:    { icone: '📍', couleur: '#3B6900', mot: 'Point de travail' },
  attention: { icone: '⚠️', couleur: '#C2700B', mot: 'Erreur à reprendre' },
  elim:      { icone: '☠️', couleur: '#B3261E', mot: 'Erreur éliminatoire' }
};
const nature = (t) => NATURES[t] || NATURES.repere;

(function(){
  const p = new URLSearchParams(location.search);
  const trace = p.get('t') || '';
  const km = p.get('km') || '';
  const min = p.get('min') || '';

  /* Les repères : « numéro~heure~nom », séparés par des barres.
     Le nom peut manquer — un repère non nommé garde son heure. */
  const reperes = (p.get('r') || '').split('|').filter(Boolean).map(bloc => {
    const m = bloc.split('~');
    return { n: m[0] || '', heure: m[1] || '', nom: m[2] || '',
             lat: parseFloat(m[3]), lon: parseFloat(m[4]),
             type: m[5] || 'repere',
             theme: m[6] || '', insp: m[7] || '', mon: m[8] || '' };
  });

  /* ⚠️ LES TROIS QUESTIONS SONT ICI, PAS DANS LE LIEN — v1006.
     Elles sont les mêmes pour tout le monde et pour toujours : les
     recopier une fois par erreur dans l'adresse, ce serait la
     rallonger pour rien. Elles doivent dire EXACTEMENT ce que dit
     le bilan — le test compare les deux listes mot pour mot. */
  const QUESTIONS = ["- qu'en penses-tu ?",
                     '- quelles sont TES solutions ?',
                     '- ce que je te PROPOSE : '];
  const avecQuestions = (p.get('q') === '1');

  const points = trace ? decoderPolyligne(trace) : [];

  if(points.length < 2){
    document.getElementById('carte').outerHTML =
      '<div class="vide">Ce lien ne contient pas de trajet.<br><br>' +
      'Il a peut-être été coupé en chemin : certains messageries ' +
      'raccourcissent les adresses longues. La carte de ton mail, elle, ' +
      'reste lisible.</div>';
    document.getElementById('chiffres').textContent = '—';
    return;
  }

  document.getElementById('chiffres').textContent =
    (km ? km + ' km' : '') + (km && min ? ' · ' : '') + (min ? min + ' min' : '');

  /* ⚠️ LA BULLE SE CONSTRUIT EN TEXTE, PUIS S'ÉCHAPPE. Leaflet
     attend du HTML : ces remarques sont tapées par un moniteur, et
     la moindre balise s'y exécuterait. On échappe les trois
     caractères qui comptent, une fois, ici. */
  const ech = (v) => String(v || '').replace(/&/g, '&amp;')
                                    .replace(/</g, '&lt;')
                                    .replace(/>/g, '&gt;');
  function bulleDuPoint(r, nat){
    let h = '<b>' + nat.icone + ' ' + ech(r.theme || r.nom || nat.mot) +
            '</b>' + (r.heure ? ' · ' + ech(r.heure) : '');
    if(r.insp) h += '<br>👨‍✈️ ' + ech(r.insp);
    if(r.mon)  h += '<br>🔱 ' + ech(r.mon);
    return h;
  }

  /* ⚠️ LE TEXTE D'ABORD, LA CARTE ENSUITE — v1006.

     La page construisait la carte en premier : si Leaflet ne
     chargeait pas — réseau coupé, filtre d'entreprise, CDN
     injoignable — le script mourait sur « L is not defined » et
     l'élève n'avait NI carte NI erreurs. Or ce qu'il vient lire,
     ce sont ses erreurs ; la carte les situe.

     La liste est donc écrite avant, et la carte est tentée après,
     sous protection. Ce qui échoue n'emporte que lui-même. */
  const carte = (typeof L === 'undefined') ? null
              : L.map('carte', { attributionControl: false });
  let trait = null;

  if(carte){
    /* ⚠️ LES TUILES PASSENT PAR LE WORKER, comme dans l'application.
       L'IGN ne pose pas l'en-tête qu'il faut, et surtout : une seule
       adresse à connaître, une seule à surveiller. */
    L.tileLayer('https://bilan-proxy.evolutionconduites.workers.dev/tuile?z={z}&x={x}&y={y}',
                { maxZoom: 18, minZoom: 8 }).addTo(carte);

    trait = L.polyline(points, { color:'#FFFFFF', weight:9,
                                 lineJoin:'round', lineCap:'round' })
             .addTo(carte);
    L.polyline(points, { color:'#3B6900', weight:4,
                         lineJoin:'round', lineCap:'round' }).addTo(carte);

    const bout = (pos, arrivee) => L.marker(pos, { icon: L.divIcon({
      className:'', html:'<div class="bout' + (arrivee ? ' arrivee' : '') + '"></div>',
      iconSize:[15,15], iconAnchor:[7,7] }), keyboard:false }).addTo(carte);
    bout(points[0], false);
    bout(points[points.length - 1], true);
  }else{
    const z = document.getElementById('carte');
    if(z){
      z.style.flex = '0 0 auto';
      z.style.padding = '18px 16px';
      z.style.fontSize = '13px';
      z.style.color = 'var(--gris)';
      z.textContent = '🗺️ Le plan n’a pas pu se charger. Tes points sont ' +
                      'listés ci-dessous, et la carte est aussi dans ton mail.';
    }
  }

  /* Une erreur, telle que le bilan la présente : ce que
     l'inspecteur a dit, ce que le moniteur a répondu, puis les
     trois questions — et seulement quand le bilan les pose. */
  function ficheDeLErreur(r){
    if(!r.insp && !r.mon) return null;
    const d = document.createElement('div');
    d.className = 'detail';

    const ligne = (emoji, texte, classe) => {
      if(!texte) return;
      const e = document.createElement('div');
      e.className = classe || 'dit';
      e.textContent = emoji + ' ' + texte;   /* jamais en HTML */
      d.appendChild(e);
    };
    ligne('👨‍✈️', r.insp);
    ligne('🔱', r.mon);

    if(avecQuestions){
      QUESTIONS.forEach(q => {
        const e = document.createElement('div');
        e.className = 'question';
        e.textContent = q;
        d.appendChild(e);
      });
    }
    return d;
  }

  const liste = document.getElementById('liste');
  reperes.forEach((r) => {
    if(carte && isFinite(r.lat) && isFinite(r.lon)){
      const nat = nature(r.type);
      L.marker([r.lat, r.lon], { icon: L.divIcon({
        className:'',
        html:'<div class="pastille" style="background:' + nat.couleur +
             '">' + r.n + '</div>',
        iconSize:[26,26], iconAnchor:[13,13] }), keyboard:false })
       .addTo(carte)
       .bindPopup(bulleDuPoint(r, nat));
    }
    const ligne = document.createElement('div');
    ligne.className = 'repere';
    const nat2 = nature(r.type);
    const n = document.createElement('span');
    n.className = 'num'; n.textContent = r.n;
    n.style.background = nat2.couleur;
    n.title = nat2.mot;
    const h = document.createElement('span');
    h.className = 'heure'; h.textContent = r.heure;
    const nom = document.createElement('span');
    /* ⚠️ JAMAIS EN HTML : ces textes sont tapés par un moniteur. */
    nom.className = 'nom';
    nom.textContent = (r.type && r.type !== 'repere' ? nat2.icone + ' ' : '') +
                      (r.theme || r.nom);
    ligne.appendChild(n); ligne.appendChild(h); ligne.appendChild(nom);
    liste.appendChild(ligne);

    /* ⚠️ ET TOUT CE QUE L'ERREUR DIT, SOUS SA LIGNE — v1006. David :
       « que ça renote tout pour l'erreur : réflexion de
       l'inspecteur, remarque du moniteur et les 3 questions du
       dessous pour le thème complet ». */
    const detail = ficheDeLErreur(r);
    if(detail) liste.appendChild(detail);
  });
  if(!reperes.length) liste.style.display = 'none';

  /* ============================================================
     ⚠️ DES POINTS SANS PASTILLE SE DISENT — v1012

     David, le 16 septembre, en rouvrant un ancien cours : « je n'ai
     pas les points d'affichés sur la carte ». Ils étaient bien là,
     dans la liste ; c'est leur POSITION qui manquait — les trajets
     rangés avant la v1010 ne la gardaient pas.

     La page montrait donc un trait nu et se taisait, ce qui se lit
     comme une panne. Une carte qui a perdu ses pastilles doit dire
     qu'elle en avait : un tampon qui ment est pire qu'un tampon
     absent.

     ⚠️ ET SEULEMENT QUAND AUCUNE N'A PU SE POSER. Un point isolé
     sans position, dans un trajet qui en place dix, ne mérite pas
     un avertissement pour toute la page.
     ============================================================ */
  const placables = reperes.filter(r => isFinite(r.lat) && isFinite(r.lon));
  if(reperes.length && !placables.length){
    const p = document.createElement('div');
    p.className = 'pied';
    p.textContent = 'Les ' + reperes.length + ' points de ce cours sont ' +
      'listés ci-dessous, mais leur emplacement n’a pas été gardé : ce ' +
      'trajet est plus ancien que la mise à jour qui enregistre la position ' +
      'des points. Le tracé, lui, est complet.';
    liste.parentNode.insertBefore(p, liste);
  }

  if(carte && trait) carte.fitBounds(trait.getBounds(), { padding:[28, 28] });
})();
</script>
</body>
</html>
