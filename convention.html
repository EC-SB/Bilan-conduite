<!-- ============================================================
     convention.html — ✍️ LA CONVENTION SIGNÉE EN LIGNE (v1282)

     David, le 27 octobre 2026 : l'envoi des conventions par mail, et
     la signature de l'entreprise. Le mail « ✉️ Envoyer à
     l'entreprise » porte un bouton « Signer la convention en ligne »
     qui ouvre cette page : convention.html#<jeton>.

     · l'entreprise lit la convention (le PDF envoyé), écrit son nom et
       sa fonction, coche « bon pour accord », signe du doigt, peut
       photographier son cachet ;
     · un code envoyé à l'adresse qui a reçu la convention confirme
       que c'est elle (le Worker le vérifie : 15 minutes, 5 essais) ;
     · la signature (et le cachet) se posent dans le cadre « Pour
       l'entreprise » de la convention, chaque page porte la mention de
       la signature, et une dernière page en donne le certificat
       (heure, nom, adresse du code, empreinte du document) — fait ICI,
       avec pdf-lib, puis renvoyé au Worker qui le range dans le
       dossier et l'envoie à l'entreprise ;
     · avec un OPCO : « J'ai déposé la demande », et son n° de dossier.

     Le jeton est dans le « # » de l'adresse : il ne part jamais dans
     les journaux d'un serveur. Rien n'est gardé sur l'appareil, sauf
     le thème.
     ============================================================ -->
<style>

<body class="clair">
<div class="boite">
  <div class="entete">
    <div class="logo">EC</div>
    <div><h1>Évolution Conduites</h1><div class="sous">organisme de formation · Saint-Brieuc</div></div>

  </div>
  <div id="ecran"><div class="card"><div class="note">Chargement…</div></div></div>
</div>

<script>
(function(){
  'use strict';
  var RELAIS = 'https://bilan-proxy.evolutionconduites.workers.dev';
  var PDFLIB = ['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', 'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'];
  var $ = function(id){ return document.getElementById(id); };
  var jeton = String(location.hash || '').replace(/^#/, '').trim();
  var V = null;                 /* ce que dit le Worker */
  var etat = { code: false, cachet: '', nom: '', fonction: '', accepte: false };
  var pad = null;

  function appliquerTheme(clair){
    document.body.classList.toggle('clair', clair);
    $('btTheme').textContent = clair ? '☀️' : '🌙';
    try{ localStorage.setItem('ec_theme_eleve', clair ? 'clair' : 'sombre'); }catch(e){}
  }
  (function(){ var c = true; try{ var g = localStorage.getItem('ec_theme_eleve'); if(g) c = (g === 'clair'); }catch(e){} appliquerTheme(c); })();
  $('btTheme').addEventListener('click', function(){ appliquerTheme(!document.body.classList.contains('clair')); });

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dateFr(iso){ var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ''; var mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre']; return (+m[3] === 1 ? '1er' : +m[3]) + ' ' + mois[+m[2] - 1]; }
  async function appel(corps){
    corps.jeton = jeton;
    var r = await fetch(RELAIS + '/convention', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
    return r.json();
  }
  function erreur(t){ $('ecran').innerHTML = '<div class="card"><div class="message erreur">' + esc(t) + '</div><div class="note">Évolution Conduites · 2-4 rue Saint Benoît, Saint-Brieuc</div></div>'; }
  function message(id, t, ok){ var m = $(id); if(!m) return; m.className = 'message ' + (ok ? 'ok' : 'erreur'); m.textContent = t; m.style.display = t ? '' : 'none'; }

  /* ---------- le cadre où l'on signe ---------- */
  function cadre(el){
    var cv = el.querySelector('canvas'), g = null, st = { n: 0, on: false, d: null, bb: null };
    function taille(){ var r = cv.getBoundingClientRect(); if(!r.width) return; var k = window.devicePixelRatio || 1; cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k); g = cv.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111'; g.fillStyle = '#111'; }
    function pt(ev){ var r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
    function bb(p){ if(!st.bb) st.bb = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; else { st.bb.x0 = Math.min(st.bb.x0, p.x); st.bb.y0 = Math.min(st.bb.y0, p.y); st.bb.x1 = Math.max(st.bb.x1, p.x); st.bb.y1 = Math.max(st.bb.y1, p.y); } }
    cv.addEventListener('pointerdown', function(ev){ if(!g) taille(); ev.preventDefault(); try{ cv.setPointerCapture(ev.pointerId); }catch(e){} st.on = true; st.d = pt(ev); bb(st.d); g.beginPath(); g.arc(st.d.x, st.d.y, 1.2, 0, 7); g.fill(); st.n++; el.classList.add('signe'); });
    cv.addEventListener('pointermove', function(ev){ if(!st.on) return; ev.preventDefault(); var p = pt(ev); g.beginPath(); g.moveTo(st.d.x, st.d.y); g.lineTo(p.x, p.y); g.stroke(); st.d = p; bb(p); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(t){ cv.addEventListener(t, function(){ st.on = false; }); });
    requestAnimationFrame(taille);
    return {
      vide: function(){ return st.n === 0; },
      effacer: function(){ taille(); st.n = 0; st.bb = null; el.classList.remove('signe'); },
      image: function(){
        if(!st.bb) return '';
        var k = window.devicePixelRatio || 1, m = 6;
        var x0 = Math.max(0, (st.bb.x0 - m) * k), y0 = Math.max(0, (st.bb.y0 - m) * k), x1 = Math.min(cv.width, (st.bb.x1 + m) * k), y1 = Math.min(cv.height, (st.bb.y1 + m) * k);
        var lw = Math.max(1, x1 - x0), lh = Math.max(1, y1 - y0), r = Math.min(1, 600 / lw);
        var c2 = document.createElement('canvas'); c2.width = Math.max(1, Math.round(lw * r)); c2.height = Math.max(1, Math.round(lh * r));
        c2.getContext('2d').drawImage(cv, x0, y0, lw, lh, 0, 0, c2.width, c2.height);
        return c2.toDataURL('image/png');
      }
    };
  }
  function photoEnJpeg(f){
    return new Promise(function(ok, non){
      var u = URL.createObjectURL(f), im = new Image();
      im.onload = function(){ var k = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight)); var c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.85)); };
      im.onerror = function(){ URL.revokeObjectURL(u); non(new Error('Photo illisible')); };
      im.src = u;
    });
  }

  /* ---------- lire la convention ---------- */
  function b64EnOctets(b){ var t = atob(b), o = new Uint8Array(t.length); for(var i = 0; i < t.length; i++) o[i] = t.charCodeAt(i); return o; }
  function octetsEnB64(o){ var s = ''; for(var i = 0; i < o.length; i += 0x8000) s += String.fromCharCode.apply(null, o.subarray(i, i + 0x8000)); return btoa(s); }
  async function lirePdf(){
    var w = window.open('', '_blank');
    try{
      var r = await appel({ quoi: 'pdf' });
      if(!r || r.status !== 'ok') throw new Error((r && r.message) || 'Convention illisible');
      var url = URL.createObjectURL(new Blob([b64EnOctets(r.contenu)], { type: 'application/pdf' }));
      if(w) w.location.href = url; else { var a = document.createElement('a'); a.href = url; a.download = r.nom || 'Convention.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
    }catch(e){ if(w) w.close(); alert(e.message || e); }
  }

  /* ---------- l'écran ---------- */
  function dessiner(){
    var r = V.resume || {}, h = '';
    var opco = !!r.opco;
    if(!V.signe){
      h += '<div class="card"><h2>✍️ Convention de formation</h2>' +
        '<div class="resume">' + esc(r.intitule || 'Formation') + (r.n ? ' · ' + r.n + ' salarié' + (r.n > 1 ? 's' : '') : '') + '<br>' + esc(r.dates || '') + (r.ttc ? ' · ' + esc(r.ttc) : '') + '</div>' +
        '<button class="btn btn-secondary" id="btLire" type="button">📄 Lire la convention' + (r.pages ? ' (' + r.pages + ' page' + (r.pages > 1 ? 's' : '') + ')' : '') + '</button>' +
        '<label for="nom">Votre nom</label><input type="text" id="nom" autocomplete="name" maxlength="120" value="' + esc(etat.nom) + '">' +
        '<label for="fonction">Votre fonction</label><input type="text" id="fonction" maxlength="120" value="' + esc(etat.fonction) + '">' +
        '<label class="accord"><input type="checkbox" id="accepte"' + (etat.accepte ? ' checked' : '') + '><span>J’ai lu la convention et je l’accepte — <i>bon pour accord</i></span></label>' +
        '<div class="t">Votre signature</div>' +
        '<div class="cadre" id="cadre"><canvas></canvas><span class="aide">signez avec le doigt ou la souris</span></div>' +
        '<div class="ligne"><button class="btn btn-secondary" id="btEffacer" type="button">↺ Effacer</button></div>' +
        '<div class="cachet" id="zCachet"></div>' +
        '<button class="btn btn-secondary" id="btCachet" type="button">🏷️ Ajouter le cachet de l’entreprise (photo)</button>' +
        '<input type="file" id="fCachet" accept="image/*" class="cache">' +
        '<div class="message erreur" id="msg" style="display:none"></div>' +
        '<div id="zCode" class="cache"><label for="code" id="lCode">Le code reçu par mail</label><input type="tel" id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7">' +
        '<button class="btn btn-primary" id="btConfirmer" type="button">✅ Confirmer et signer</button>' +
        '<button class="btn btn-secondary" id="btRenvoyer" type="button">Renvoyer le code</button></div>' +
        '<button class="btn btn-primary" id="btSigner" type="button">✍️ Signer la convention</button>' +
        '<div class="note">Un code reçu par mail confirme que c’est bien vous. La convention signée vous est renvoyée en PDF, avec la date et l’heure de signature.</div></div>';
    } else {
      h += '<div class="card fini"><div class="gros">✅</div><b>Convention signée</b>' +
        '<div class="note">le ' + esc(V.signe.jour) + ' à ' + esc(V.signe.heure) + ' par ' + esc(V.signe.nom) + (V.signe.fonction ? ' (' + esc(V.signe.fonction) + ')' : '') + '</div>' +
        '<div class="message erreur" id="msgPdf" style="display:none"></div>' +
        '<button class="btn btn-secondary" id="btLire" type="button" style="margin-top:12px">📄 ' + (V.signe.pdf ? 'La convention signée (PDF)' : 'La convention') + '</button>' +
        (V.signe.pdf ? '<div class="note">Elle vous a aussi été envoyée par mail.</div>' : '') + '</div>';
    }
    if(opco){
      h += '<div class="card"><div class="t">🏦 Ensuite : la demande à votre OPCO</div>';
      if(V.opco){
        h += '<div class="message ok">✅ Demande déposée — vous nous l’avez dit le ' + esc(V.opco.jour) + (V.opco.numero ? ' · n° ' + esc(V.opco.numero) : '') + '. Merci !</div>';
      } else {
        h += '<div class="note" style="margin-bottom:12px;font-size:14px;color:var(--cream)">Déposez la demande de prise en charge' + (r.avant ? ' <b>avant le ' + esc(dateFr(r.avant)) + '</b>' : ' avant le début de la formation') + ' sur votre espace ' + esc(r.opco) + ', avec la convention signée et le programme.</div>' +
          '<label for="numOpco">N° de dossier OPCO (si vous l’avez)</label><input type="text" id="numOpco" maxlength="60">' +
          '<div class="message erreur" id="msgOpco" style="display:none"></div>' +
          '<button class="btn btn-secondary" id="btOpco" type="button"' + (V.signe ? '' : ' disabled') + '>✅ J’ai déposé la demande</button>' +
          (V.signe ? '' : '<div class="note">Après la signature de la convention.</div>');
      }
      h += '</div>';
    }
    $('ecran').innerHTML = h;
    $('btLire').addEventListener('click', lirePdf);
    if($('btOpco')) $('btOpco').addEventListener('click', deposerOpco);
    if(V.signe) return;
    pad = cadre($('cadre'));
    ['nom', 'fonction'].forEach(function(k){ $(k).addEventListener('input', function(){ etat[k] = $(k).value; }); });
    $('accepte').addEventListener('change', function(){ etat.accepte = $('accepte').checked; });
    $('btEffacer').addEventListener('click', function(){ pad.effacer(); });
    $('btCachet').addEventListener('click', function(){ $('fCachet').click(); });
    $('fCachet').addEventListener('change', async function(){
      var f = $('fCachet').files && $('fCachet').files[0];
      if(!f) return;
      try{ etat.cachet = await photoEnJpeg(f); montrerCachet(); }catch(e){ message('msg', e.message || String(e)); }
      $('fCachet').value = '';
    });
    montrerCachet();
    $('btSigner').addEventListener('click', demanderCode);
    $('btRenvoyer').addEventListener('click', function(){ etat.code = false; demanderCode(); });
    $('btConfirmer').addEventListener('click', signer);
  }
  function montrerCachet(){
    var z = $('zCachet');
    if(!z) return;
    z.innerHTML = '';
    if(!etat.cachet) return;
    var im = document.createElement('img'); im.src = etat.cachet; im.alt = 'Cachet';
    var b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-secondary'; b.style.width = 'auto'; b.style.margin = '0'; b.textContent = '✕ Retirer';
    b.addEventListener('click', function(){ etat.cachet = ''; montrerCachet(); });
    z.appendChild(im); z.appendChild(b);
  }
  function verifier(){
    if(String(etat.nom).trim().length < 3){ message('msg', 'Écrivez votre nom.'); $('nom').focus(); return false; }
    if(!etat.accepte){ message('msg', 'Cochez « J’ai lu la convention et je l’accepte ».'); return false; }
    if(pad.vide()){ message('msg', 'Signez dans le cadre.'); return false; }
    return true;
  }
  async function demanderCode(){
    if(!verifier()) return;
    var b = $('btSigner'); b.disabled = true; $('btRenvoyer').disabled = true;
    try{
      var r = await appel({ quoi: 'code' });
      if(!r || r.status !== 'ok') throw new Error((r && r.message) || 'Le code n’est pas parti');
      etat.code = true;
      $('zCode').classList.remove('cache');
      b.classList.add('cache');
      $('lCode').textContent = 'Le code envoyé à ' + (r.mailMasque || 'votre adresse');
      message('msg', '📨 Un code vient de partir à ' + (r.mailMasque || 'votre adresse') + ' (valable 15 minutes).', true);
      $('code').focus();
    }catch(e){ message('msg', e.message || String(e)); b.disabled = false; }
    $('btRenvoyer').disabled = false;
  }
  async function signer(){
    if(!verifier()) return;
    var code = String($('code').value || '').replace(/\D/g, '');
    if(code.length !== 6){ message('msg', 'Le code a six chiffres.'); return; }
    var b = $('btConfirmer'); b.disabled = true; b.textContent = 'Signature…';
    var image = pad.image();
    try{
      var r = await appel({ quoi: 'signer', code: code, nom: etat.nom.trim(), fonction: String(etat.fonction || '').trim(), accepte: true, signature: image, cachet: etat.cachet || '' });
      if(!r || r.status !== 'ok') throw new Error((r && r.message) || 'Signature refusée');
      V = r;
      dessiner();
      /* la convention signée, faite ici, renvoyée au Worker */
      try{
        await fabriquerEtEnvoyer(image, etat.cachet);
        var v = await appel({ quoi: 'lire' });
        if(v && v.status === 'ok'){ V = v; dessiner(); }
      }catch(e2){ message('msgPdf', 'La convention est bien signée. Le PDF signé n’a pas pu être fabriqué ici : nous vous l’enverrons.'); }
    }catch(e){ message('msg', e.message || String(e)); b.disabled = false; b.textContent = '✅ Confirmer et signer'; }
  }
  async function deposerOpco(){
    var b = $('btOpco'); b.disabled = true;
    try{
      var r = await appel({ quoi: 'opco', numero: ($('numOpco').value || '').trim() });
      if(!r || r.status !== 'ok') throw new Error((r && r.message) || 'Non enregistré');
      V = r; dessiner();
    }catch(e){ message('msgOpco', e.message || String(e)); b.disabled = false; }
  }

  /* ---------- la convention signée (pdf-lib) ---------- */
  function chargerPdfLib(){
    if(window.PDFLib) return Promise.resolve(window.PDFLib);
    return new Promise(function(ok, non){
      var i = 0;
      (function essai(){
        if(i >= PDFLIB.length){ non(new Error('pdf-lib injoignable')); return; }
        var s = document.createElement('script'); s.src = PDFLIB[i++];
        s.onload = function(){ window.PDFLib ? ok(window.PDFLib) : essai(); };
        s.onerror = essai;
        document.head.appendChild(s);
      })();
    });
  }
  function winAnsi(t){ return String(t || '').replace(/\u2022/g, '*').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[  ]/g, ' ').replace(/[^\x20-\x7E -ÿ]/g, ''); }
  async function empreinte(o){ var h = await crypto.subtle.digest('SHA-256', o); return Array.from(new Uint8Array(h)).map(function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
  async function fabriquerEtEnvoyer(signature, cachet){
    var L = await chargerPdfLib();
    var r = await appel({ quoi: 'pdf' });
    if(!r || r.status !== 'ok') throw new Error('Convention illisible');
    var octets = b64EnOctets(r.contenu);
    var sha = await empreinte(octets);
    var pdf = await L.PDFDocument.load(octets);
    var police = await pdf.embedFont(L.StandardFonts.Helvetica), gras = await pdf.embedFont(L.StandardFonts.HelveticaBold);
    var sig = await pdf.embedPng(b64EnOctets(signature.split(',')[1]));
    var cach = cachet ? await pdf.embedJpg(b64EnOctets(cachet.split(',')[1])) : null;
    var mm = 72 / 25.4, gris = L.rgb(0.35, 0.35, 0.35);
    var s = V.signe, ref = (V.resume && V.resume.numero) || '';
    var mention = winAnsi('Signé électroniquement le ' + s.jour + ' à ' + s.heure + ' par ' + s.nom + (s.fonction ? ', ' + s.fonction : '') + ' (code de confirmation envoyé à ' + V.mailMasque + ')');
    var pages = pdf.getPages();
    var z = V.zone;
    if(z && pages[z.page - 1]){
      var p = pages[z.page - 1], H = p.getHeight();
      var bx = z.x * mm, by = H - (z.y + z.h) * mm, bw = z.w * mm, bh = z.h * mm;
      var place = function(img, x, y, w, h){ var k = Math.min(w / img.width, h / img.height); p.drawImage(img, { x: x + (w - img.width * k) / 2, y: y + (h - img.height * k) / 2, width: img.width * k, height: img.height * k }); };
      place(sig, bx + 4, by + 12, (cach ? bw * 0.58 : bw) - 8, bh - 16);
      if(cach) place(cach, bx + bw * 0.6, by + 12, bw * 0.4 - 6, bh - 16);
      p.drawText(winAnsi('Signé électroniquement le ' + s.jour + ' à ' + s.heure), { x: bx + 4, y: by + 3.5, size: 6.5, font: police, color: gris });
    }
    pages.forEach(function(p){ p.drawText(mention.slice(0, 160), { x: 14 * mm, y: 4 * mm, size: 6, font: police, color: gris }); });
    /* le certificat de signature */
    var c = pdf.addPage([595.28, 841.89]), y = 780;
    /* une ligne trop longue passe à la ligne suivante (mot par mot) */
    var ecrire = function(t, o){
      o = o || {};
      var taille = o.taille || 11, f = o.gras ? gras : police, mots = winAnsi(t).split(' '), ligne = '', lignes = [];
      mots.forEach(function(m){ var essai = ligne ? ligne + ' ' + m : m; if(f.widthOfTextAtSize(essai, taille) > 475 && ligne){ lignes.push(ligne); ligne = m; } else ligne = essai; });
      if(ligne) lignes.push(ligne);
      lignes.forEach(function(l){ c.drawText(l, { x: 60, y: y, size: taille, font: f, color: o.gris ? gris : L.rgb(0, 0, 0) }); y -= taille * 1.35; });
      y -= (o.apres || 6);
    };
    ecrire('Certificat de signature électronique', { taille: 17, gras: true, apres: 14 });
    ecrire('Document : convention de formation' + (ref ? ' réf. ' + ref : ''), {});
    ecrire('Formation : ' + ((V.resume && V.resume.intitule) || ''), {});
    ecrire('Entreprise : ' + ((V.resume && V.resume.entreprise) || ''), { apres: 14 });
    ecrire('Signataire : ' + s.nom + (s.fonction ? ', ' + s.fonction : ''), { gras: true });
    ecrire('Date et heure de signature (heure de Paris) : le ' + s.jour + ' à ' + s.heure, {});
    ecrire('Confirmation : code à usage unique envoyé par mail à ' + V.mailMasque + ', saisi sur la page de signature', {});
    ecrire('Mention acceptée : « J’ai lu la convention et je l’accepte — bon pour accord »', { apres: 14 });
    ecrire('Empreinte SHA-256 de la convention avant signature :', { taille: 9.5 });
    ecrire(sha, { taille: 8.5, gris: true, apres: 18 });
    ecrire('Signature :', { gras: true });
    var k = Math.min(220 / sig.width, 80 / sig.height);
    c.drawImage(sig, { x: 60, y: y - sig.height * k + 6, width: sig.width * k, height: sig.height * k });
    if(cach){ var k2 = Math.min(160 / cach.width, 100 / cach.height); c.drawImage(cach, { x: 320, y: y - cach.height * k2 + 6, width: cach.width * k2, height: cach.height * k2 }); }
    y -= 120;
    ecrire('Signature électronique simple (règlement eIDAS, article 25) : horodatée, nominative, non modifiable. Le journal du dossier chez Évolution Conduites en garde la trace.', { taille: 9, gris: true });
    pdf.setTitle(winAnsi('Convention signée ' + ref));
    var fait = await pdf.save();
    var rr = await appel({ quoi: 'pdfSigne', contenu: octetsEnB64(fait) });
    if(!rr || rr.status !== 'ok') throw new Error((rr && rr.message) || 'PDF refusé');
  }

  async function charger(){
    if(!/^[A-Za-z0-9]{32}$/.test(jeton)){ erreur('Ce lien est incomplet. Ouvrez-le depuis le bouton du mail.'); return; }
    try{
      var r = await appel({ quoi: 'lire' });
      if(!r || r.status !== 'ok'){ erreur((r && r.message) || 'Ce lien n’est pas valable.'); return; }
      V = r;
      dessiner();
    }catch(e){ erreur('La page ne répond pas. Vérifiez votre connexion, puis réessayez.'); }
  }
  charger();
})();
</script>
